<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AI质检 - 开业预验收</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pm:#00A4F1;--qc:#FFA64C;--role:var(--pm);--bg:#F7F9FC;--card:#fff;--ink:#1D2129;--muted:#6E7681;--aux:#86909C;--rule:#EDF0F5;--green:#02C2C2;--red:#FF4C4C;--radius:4px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;max-width:375px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
/* 氛围光晕装饰 - 低透明度蓝色弥散 */
body::before{content:'';position:fixed;top:-60px;left:50%;transform:translateX(-50%);width:380px;height:260px;background:radial-gradient(ellipse at center,rgba(0,164,241,.10) 0%,rgba(0,164,241,.04) 40%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-80px;left:50%;transform:translateX(-50%);width:340px;height:220px;background:radial-gradient(ellipse at center,rgba(0,164,241,.05) 0%,transparent 65%);pointer-events:none;z-index:0}

/* Header - 顶部毛玻璃质感 */
.header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:375px;height:52px;background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;padding:0 16px;z-index:100;-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid rgba(0,164,241,.06)}
.header .back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;color:var(--ink);position:absolute;left:8px;border-radius:50%;transition:background .15s}
.header .back-btn:active{background:#E6F7FF}
.header .back-btn svg{width:20px;height:20px;stroke-width:2.2}
.header .title{font-size:17px;font-weight:600;color:var(--ink);text-align:center;letter-spacing:.2px}
.header .role-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:none;background:#E6F7FF;border-radius:50%;cursor:pointer;color:var(--pm);position:absolute;right:12px;transition:all .15s}
.header .role-btn:active{background:#E6F7FF;transform:scale(.95)}
.header .role-btn svg{width:18px;height:18px;stroke-width:1.8}

/* Role Menu */
.role-menu{position:fixed;top:56px;right:12px;background:#fff;border-radius:4px;box-shadow:0 4px 20px rgba(0,164,241,.12);z-index:200;display:none;overflow:hidden;min-width:150px;border:1px solid var(--rule)}
.role-menu.show{display:block;animation:menuIn .2s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.role-menu-item{padding:12px 18px;display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;border-bottom:1px solid #F5F7FA}
.role-menu-item:last-child{border-bottom:none}
.role-menu-item:active{background:#E6F7FF}
.role-menu-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.role-menu-item .dot.pm{background:var(--pm)}
.role-menu-item .dot.qc{background:var(--qc)}
.role-menu-item.active{font-weight:600;color:var(--pm)}

/* Pages */
.page{position:fixed;top:52px;left:50%;transform:translateX(-50%);width:100%;max-width:375px;bottom:0;background:transparent;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .28s ease,visibility 0s .28s;visibility:hidden;pointer-events:none;z-index:10}
.page.active{transform:translateX(-50%) translateY(0);visibility:visible;pointer-events:auto;transition:transform .28s ease,visibility 0s 0s}
.page::-webkit-scrollbar{display:none}
.page-inner{padding:10px 10px 132px}

/* Home page: flex layout for fixed hero + scrollable content */
.page-home{top:0;display:flex;flex-direction:column;overflow:hidden}
.page-home .home-content{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.page-home .home-content::-webkit-scrollbar{display:none}

/* Status Bar - 蓝色角色卡片，内部柔和渐变 + 毛玻璃质感 */
.status-bar{background:linear-gradient(135deg,rgba(0,164,241,.92) 0%,rgba(0,135,199,.88) 60%,rgba(169,228,255,.85) 100%);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:var(--radius);padding:20px 22px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(0,164,241,.22),inset 0 1px 0 rgba(255,255,255,.18);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.status-bar::before{content:'';position:absolute;top:-30px;right:-25px;width:110px;height:110px;background:radial-gradient(circle,rgba(255,255,255,.18) 0%,transparent 70%);border-radius:50%}
.status-bar::after{content:'';position:absolute;bottom:-40px;right:30px;width:80px;height:80px;background:radial-gradient(circle,rgba(255,255,255,.10) 0%,transparent 70%);border-radius:50%}
.status-bar .sb-left{display:flex;flex-direction:column;gap:5px;position:relative;z-index:1}
.status-bar .sb-label{font-size:12px;color:rgba(255,255,255,.82);letter-spacing:.2px}
.status-bar .sb-value{font-size:18px;font-weight:700;color:#fff}
.status-bar .sb-right{text-align:right;position:relative;z-index:1}
.status-bar .sb-pct{font-size:30px;font-weight:800;color:#fff;line-height:1;letter-spacing:-.5px}
.status-bar .sb-pct-label{font-size:11px;color:rgba(255,255,255,.78);margin-top:3px}

/* Score Summary */
.score-summary{background:#fff;border-radius:var(--radius);padding:16px 20px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,164,241,.05);border:1px solid rgba(0,164,241,.03)}
.score-summary .ss-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.score-summary .ss-label{font-size:13px;color:var(--muted)}
.score-summary .ss-value{font-size:15px;font-weight:600}
.score-summary .ss-value.pm{color:var(--pm)}
.score-summary .ss-value.qc{color:var(--qc)}

/* Module Cards Grid */
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.module-card{background:#fff;border-radius:var(--radius);padding:20px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .2s;box-shadow:0 2px 12px rgba(0,164,241,.05);position:relative;overflow:hidden;border:1px solid rgba(0,164,241,.03)}
.module-card:active{transform:scale(.97);box-shadow:0 1px 6px rgba(0,164,241,.08)}
.module-card .mc-icon{font-size:28px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#E6F7FF 0%,#E6F7FF 100%);border-radius:4px;margin-bottom:4px}
.module-card .mc-name{font-size:14px;font-weight:600;color:var(--ink)}
.module-card .mc-count{font-size:11px;color:var(--aux)}
.module-card .mc-progress{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--pm),#0087C7);border-radius:0 0 3px 0}
.module-card .mc-badge{position:absolute;top:10px;right:10px;background:#E6F7FF;border-radius:4px;padding:2px 8px;font-size:10px;color:var(--aux);font-weight:500}
.module-card .mc-done{position:absolute;bottom:8px;right:10px;font-size:10px;color:var(--pm);font-weight:600;background:#E6F7FF;padding:2px 8px;border-radius:4px}

/* Sub-module List */
.sub-list{display:flex;flex-direction:column;gap:10px}
.sub-card{background:#fff;border-radius:var(--radius);padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 2px 12px rgba(0,164,241,.05);transition:all .15s;border:1px solid rgba(0,164,241,.03)}
.sub-card:active{transform:scale(.98)}
.sub-card .sc-icon{font-size:24px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#E6F7FF 0%,#E6F7FF 100%);border-radius:4px;flex-shrink:0}
.sub-card .sc-info{flex:1}
.sub-card .sc-name{font-size:15px;font-weight:600;color:var(--ink)}
.sub-card .sc-count{font-size:12px;color:var(--aux);margin-top:3px}
.sub-card .sc-arrow{color:var(--aux);font-size:22px;font-weight:300}
.sub-card .sc-progress-bar{width:50px;height:4px;background:#EDF0F5;border-radius:2px;margin-top:6px;overflow:hidden}
.sub-card .sc-progress-fill{height:100%;background:linear-gradient(90deg,var(--pm),#0087C7);border-radius:2px;transition:width .3s}

/* Detail Page */
.detail-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.detail-header .dh-icon{font-size:22px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#E6F7FF 0%,#E6F7FF 100%);border-radius:4px;flex-shrink:0}
.detail-header .dh-name{font-size:18px;font-weight:700;flex:1;color:var(--ink)}
.detail-header .dh-count{font-size:12px;color:var(--pm);background:#E6F7FF;padding:4px 12px;border-radius:999px;font-weight:600}

/* Location Image */
.loc-image{border-radius:var(--radius);overflow:hidden;margin-bottom:10px;box-shadow:0 4px 16px rgba(0,164,241,.1);position:relative}
.loc-image img{display:block;width:100%;height:auto}
.loc-image .loc-img-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(29,33,41,.7));color:#fff;font-size:12px;padding:28px 14px 10px;font-weight:500}

/* Section Header - 左侧竖条 + 粗标题 + 灰描述 + 右侧胶囊计数 */
.section-header{display:flex;align-items:center;gap:10px;margin:18px 0 10px;padding:0 4px}
.section-header .sh-bar{width:4px;height:20px;border-radius:2px;background:linear-gradient(180deg,#00A4F1,#0087C7);flex-shrink:0}
.section-header .sh-text{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.section-header .sh-title{font-size:17px;font-weight:800;color:var(--ink);line-height:1.3;letter-spacing:-.3px}
.section-header .sh-desc{font-size:12px;color:var(--aux);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-header .sh-count{font-size:12px;font-weight:600;color:var(--pm);background:rgba(0,164,241,.1);padding:4px 12px;border-radius:999px;flex-shrink:0;letter-spacing:.2px}
.section-header .sh-count.deduction{color:#FF4C4C;background:rgba(255,76,76,.1)}
.section-header .sh-tag{display:none}
/* Groups Tabs (客观项/主观项切换) */
.groups-tabs{display:flex;margin:14px 0 0;border-bottom:1.5px solid rgba(0,164,241,.15);padding:0 4px}
.gtab{flex:1;background:none;border:none;padding:12px 0;font-size:15px;font-weight:600;color:var(--aux);cursor:pointer;position:relative;transition:color .2s;font-family:inherit;text-align:center}
.gtab.active{color:var(--pm)}
.gtab.active::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-1.5px;width:32px;height:2.5px;background:var(--pm);border-radius:2px}
.groups-panel{padding-top:10px}
.gp-meta{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px;padding:0 4px}
.gp-desc{font-size:12px;color:var(--aux)}
.gp-score{font-size:12px;font-weight:600;color:var(--pm);background:rgba(0,164,241,.1);padding:3px 10px;border-radius:999px}

/* Check Item */
.check-item{background:#fff;border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,164,241,.05);position:relative;border:1px solid rgba(0,164,241,.03)}
.check-item.baseline{border-left:3px solid var(--red);padding-left:17px}
.check-item .ci-name{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px;color:var(--ink);line-height:1.5;flex-wrap:wrap}
.check-item .ci-name .ci-name-text{flex:1 1 auto;min-width:0}
.check-item .ci-baseline-tag{font-size:10px;color:#fff;background:linear-gradient(135deg,#FF4C4C,#CB0000);padding:2px 8px;border-radius:999px;font-weight:500;flex-shrink:0}
.check-item .ci-category-tag{font-size:10px;color:#fff;padding:2px 8px;border-radius:999px;font-weight:500;flex-shrink:0}
.check-item .ci-category-tag.cat-a{background:linear-gradient(135deg,#02C2C2,#0A8C8C)}
.check-item .ci-category-tag.cat-b{background:linear-gradient(135deg,#FFA64C,#D48030)}
.check-item .ci-score{font-size:11px;font-weight:500;color:var(--pm);background:#E6F7FF;padding:2px 10px;border-radius:999px;margin-left:auto;flex-shrink:0;white-space:nowrap}
.check-item .ci-standard{font-size:12px;color:var(--muted);line-height:1.7}
.check-item .ci-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.check-item .ci-tag{font-size:15px;font-weight:700;color:#3A5A9C;background:#F5F7FB;border:1.5px solid #E0E8F5;border-radius:14px;padding:10px 20px;letter-spacing:.5px}
.filing-item .ci-tags{margin:5px 0}
.filing-item .ci-tag{font-size:12px;font-weight:600;color:#3A5A9C;background:#E3E9F2;border:1px solid #D5DDEC;border-radius:7px;padding:3px 8px;letter-spacing:.3px;margin-right:4px;margin-bottom:4px}
.filing-item .ci-tag:last-child{margin-right:0}
.check-item .ci-design{font-size:12px;color:var(--pm);margin-top:4px}
.ci-actions{display:flex;gap:8px;margin-top:12px}
.ci-btn{flex:1;height:38px;border:1.5px solid var(--rule);border-radius:4px;font-size:13px;font-weight:500;cursor:pointer;background:#FAFBFD;color:var(--muted);transition:all .18s;display:flex;align-items:center;justify-content:center;gap:4px;font-family:inherit}
.ci-btn.pass.active{background:#E6FAF6;border-color:#02C2C2;color:var(--green)}
.ci-btn.fail.active{background:#FFEBEB;border-color:#FF4C4C;color:var(--red)}
.ci-btn.partial.active{background:#FCF4E9;border-color:#FFA64C;color:#BB5E00}
.ci-btn:active{transform:scale(.97)}

/* Partial (比较符合) Score Input */
.ci-actions-partial{gap:6px}
.ci-actions-partial .ci-btn.pass{flex:0 0 28%}
.ci-actions-partial .ci-btn.partial{flex:0 0 40%}
.ci-actions-partial .ci-btn.fail{flex:0 0 28%}
.partial-score{display:none;margin-top:10px;background:#FCF4E9;border:1px solid #FCF4E9;border-radius:4px;padding:12px 14px}
.partial-score.show{display:block}
.partial-score .ps-label{font-size:12px;color:#BB5E00;margin-bottom:8px;font-weight:500}
.partial-score .ps-row{display:flex;align-items:center;gap:10px}
.partial-score .ps-input{width:80px;height:40px;border:1.5px solid #FFA64C;border-radius:4px;text-align:center;font-size:18px;font-weight:700;color:#BB5E00;outline:none;background:#fff;-webkit-appearance:none;-moz-appearance:textfield;font-family:inherit}
.partial-score .ps-input::-webkit-outer-spin-button,.partial-score .ps-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.partial-score .ps-cur{font-size:13px;color:#BB5E00;font-weight:600;flex:1}

/* PM Result (QC read-only) */
.ci-pm-result{font-size:12px;padding:5px 12px;border-radius:999px;margin-top:10px;display:inline-flex;align-items:center;gap:4px;font-weight:500}
.ci-pm-result.pm-pass{background:#E6FAF6;color:var(--green)}
.ci-pm-result.pm-fail{background:#FFEBEB;color:var(--red)}
.ci-pm-result.pm-partial{background:#FCF4E9;color:#BB5E00}
.ci-pm-result.pm-none{background:#F5F7FA;color:var(--aux)}

/* Photo Upload */
.photo-upload{display:none;margin-top:12px}
.photo-upload.show{display:block}
.photo-upload .pu-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.photo-upload .pu-area{border:1.5px dashed #A9E4FF;border-radius:4px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;background:#E6F7FF}
.photo-upload .pu-area:active{border-color:var(--pm);background:#E6F7FF}
.photo-upload .pu-area svg{width:28px;height:28px;color:var(--pm);margin-bottom:6px}
.photo-upload .pu-area .pu-text{font-size:12px;color:var(--muted)}
.photo-upload .pu-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photo-upload .pu-preview img{width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--rule)}

/* Filing Item */
.filing-item{background:#fff;border-radius:var(--radius);padding:18px 18px 4px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,164,241,.05);border:1px solid rgba(0,164,241,.03)}
.filing-item .fi-name{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--ink);line-height:1.4}
.filing-item .fi-name.fi-sub{font-size:13px;font-weight:400;margin-bottom:6px;color:var(--muted)}
.filing-item .fi-name .ci-score{font-size:11px;font-weight:500;color:var(--pm);background:#E6F7FF;padding:2px 10px;border-radius:999px;margin-left:auto;flex-shrink:0;white-space:nowrap}
.filing-item .fi-dir{font-size:12px;color:var(--pm);margin-bottom:4px;font-weight:500}
.filing-item .fi-desc{font-size:13px;color:var(--muted);line-height:1.7}
.filing-item .fi-label,.filing-item .fi-name .fi-label,.filing-item .fi-desc .fi-label,.filing-item .fi-rooms-title .fi-label{font-size:11px!important;font-weight:500!important;color:#fff!important;background:linear-gradient(135deg,#FFA64C,#D48030);padding:2px 8px;border-radius:999px;margin-right:6px;flex-shrink:0;white-space:nowrap}
.filing-item .fi-rooms{margin:10px 0}
.filing-item .fi-rooms-title{margin-bottom:8px}
.filing-item .fi-rooms-table{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.filing-item .fi-room-row{display:flex;align-items:center;justify-content:space-between;background:#F7FAFE;border:1px solid rgba(0,164,241,.08);border-radius:4px;padding:6px 10px}
.filing-item .fi-room-no{font-size:13px;font-weight:600;color:var(--ink)}
.filing-item .fi-room-area{font-size:12px;font-weight:600;color:var(--pm)}

/* Value Input */
.value-input{margin-top:10px}
.value-input .vi-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.value-input input{width:100%;height:40px;border:1.5px solid var(--rule);border-radius:4px;padding:0 14px;font-size:14px;color:var(--ink);outline:none;background:#FAFBFD;font-family:inherit;transition:border-color .2s}
.value-input input:focus{border-color:var(--pm);background:#fff;box-shadow:0 0 0 3px rgba(0,164,241,.08)}
.value-input-dual{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.value-input-dual input{width:100%;height:40px;border:1.5px solid var(--rule);border-radius:4px;padding:0 14px;font-size:14px;color:var(--ink);outline:none;background:#FAFBFD;font-family:inherit;transition:border-color .2s}
.value-input-dual input:focus{border-color:var(--pm);background:#fff;box-shadow:0 0 0 3px rgba(0,164,241,.08)}
.value-input-dual .vid-row{display:flex;align-items:center;gap:10px}
.value-input-dual .vid-std{font-size:13px;color:#0A8C8C;white-space:nowrap;flex-shrink:0;width:92px}
.value-input-dual .vid-row input{width:152px;flex:none;box-sizing:border-box}

/* Room Area Groups (多房型实测面积) */
.area-groups{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.area-group{background:#F7F9FC;border-radius:4px;padding:14px 14px 12px}
.area-group-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.area-group-badge{width:28px;height:28px;border-radius:50%;background:#4080FF;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.area-group-label{font-size:15px;font-weight:600;color:var(--ink)}
.area-group-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.area-group-row .agr-label{font-size:13px;color:var(--muted);white-space:nowrap;writing-mode:vertical-lr;letter-spacing:2px;font-weight:500;line-height:1;height:auto;padding:4px 0}
.area-group-row .agr-input-wrap{flex:1;position:relative}
.area-group-row .agr-input{width:100%;height:40px;border:1.5px solid var(--rule);border-radius:4px;padding:0 36px 0 14px;font-size:14px;color:var(--ink);outline:none;background:#fff;font-family:inherit;transition:border-color .2s}
.area-group-row .agr-input:focus{border-color:var(--pm);box-shadow:0 0 0 3px rgba(0,164,241,.08)}
.area-group-row .agr-unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--aux);pointer-events:none}
.area-group-btns{display:flex;gap:8px}
.area-group-btns .agb-btn{flex:1;height:38px;border:1.5px solid var(--rule);border-radius:4px;background:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.area-group-btns .agb-btn:active{transform:scale(.97)}
.area-group-btns .agb-pass{color:#02C2C2;border-color:#02C2C2}
.area-group-btns .agb-pass.active{background:#E6FAF6;border-color:#02C2C2;color:#00A8A8;font-weight:600}
.area-group-btns .agb-fail{color:#FF4C4C;border-color:#FF4C4C}
.area-group-btns .agb-fail.active{background:#FFECEC;border-color:#FF4C4C;color:#E03636;font-weight:600}
.area-fail-section{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.area-fail-field{display:flex;flex-direction:column;gap:6px}
.area-fail-field .aff-label{font-size:13px;color:var(--muted);font-weight:500}
.area-fail-field .aff-input{width:100%;height:40px;border:1.5px solid var(--rule);border-radius:4px;padding:0 14px;font-size:14px;color:var(--ink);outline:none;background:#FAFBFD;font-family:inherit;transition:border-color .2s}
.area-fail-field .aff-input:focus{border-color:var(--pm);background:#fff;box-shadow:0 0 0 3px rgba(0,164,241,.08)}
.area-fail-upload{border:1.5px dashed var(--rule);border-radius:4px;padding:18px;text-align:center;cursor:pointer;transition:all .15s;background:#FAFBFD}
.area-fail-upload:active{background:#F0F7FF;border-color:var(--pm)}
.area-fail-upload .afu-icon{font-size:20px;color:var(--aux);margin-bottom:4px}
.area-fail-upload .afu-text{font-size:13px;color:var(--aux)}

/* IT Placeholder */
.it-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.it-placeholder .it-icon{font-size:48px;margin-bottom:12px;opacity:.3}
.it-placeholder .it-text{font-size:14px;color:var(--muted)}
.it-placeholder .it-sub{font-size:12px;color:#BCC4D0;margin-top:4px}

/* Score Detail (bottom of detail page) */
.score-detail{background:#fff;border-radius:var(--radius);padding:18px 20px;margin-top:10px;box-shadow:0 2px 12px rgba(0,164,241,.05);border:1px solid rgba(0,164,241,.03)}
.score-detail .sd-title{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.score-detail .sd-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.score-detail .sd-row .sd-label{color:var(--muted)}
.score-detail .sd-row .sd-val{font-weight:600}
.score-detail .sd-row .sd-val.pm{color:var(--pm)}
.score-detail .sd-row .sd-val.qc{color:var(--qc)}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(29,33,41,.85);color:#fff;padding:10px 24px;border-radius:4px;font-size:13px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;backdrop-filter:blur(8px)}
.toast.show{opacity:1}

/* Bottom Bar - 毛玻璃质感，上下两栏 */
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:375px;background:rgba(255,255,255,.92);border-top:1px solid rgba(0,164,241,.08);padding:10px 14px 12px;display:none;flex-direction:column;gap:10px;z-index:90;-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:0 -4px 20px rgba(0,164,241,.06)}
.bottom-bar.show{display:flex}
.bb-progress{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bb-prog-label{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-prog-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.bb-prog-pct{font-size:14px;font-weight:700;color:var(--pm);line-height:1}
.bb-prog-score{font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;background:#E6F7FF;color:var(--pm);white-space:nowrap;line-height:1.3}
.bb-prog-bar{width:100%;height:4px;background:#EDF0F5;border-radius:2px;overflow:hidden}
.bb-prog-fill{height:100%;border-radius:2px;transition:width .3s;background:var(--pm)}
.bb-btns{display:flex;gap:10px}
.bb-btn{height:44px;border:none;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.bb-btn.primary{flex:2;background:linear-gradient(135deg,#0087C7 0%,#00A4F1 100%);color:#fff;box-shadow:0 4px 14px rgba(0,164,241,.3)}
.bb-btn.primary:active{transform:scale(.98);box-shadow:0 2px 6px rgba(0,164,241,.2)}
.bb-btn.secondary{flex:1;background:#fff;border:1.5px solid #D4E8FC;color:var(--ink)}
.bb-btn.secondary:active{background:#E6F7FF}
.bb-btn svg{width:18px;height:18px}

/* Room Sampling */
.room-info{background:#fff;border-radius:var(--radius);padding:20px 22px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,164,241,.05);border:1px solid rgba(0,164,241,.03)}
.room-info .ri-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.room-info .ri-label{font-size:13px;color:var(--muted)}
.room-info .ri-value{font-size:15px;font-weight:600;color:var(--ink)}
.room-info .ri-tip{font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px;padding:10px 14px;background:#E6F7FF;border-radius:4px}
.room-info .ri-regen,.room-block .ri-regen{margin-top:14px;height:40px;border:1px solid rgba(0,164,241,.3);background:#F7FAFE;color:var(--pm);border-radius:4px;font-size:13px;cursor:pointer;width:100%;font-weight:500;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.room-info .ri-regen:hover,.room-block .ri-regen:hover{background:#E6F7FF;border-color:var(--pm)}
.room-info .ri-regen:active,.room-block .ri-regen:active{background:#D6EEFF;transform:scale(.98)}
.room-info .ri-regen:disabled,.room-block .ri-regen:disabled{background:#F5F7FA;border-color:#E5E6EB;color:#C9CDD4;cursor:not-allowed}
.room-info .ri-regen:disabled:hover,.room-block .ri-regen:disabled:hover{background:#F5F7FA;border-color:#E5E6EB}
.room-info .ri-regen:disabled:active,.room-block .ri-regen:disabled:active{background:#F5F7FA;transform:none}
.room-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:0}
.room-card{background:#fff;border-radius:4px;padding:16px 8px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,164,241,.05);transition:all .15s;position:relative;border:1.5px solid transparent}
.room-card:active{transform:scale(.95)}
.room-card .rc-num{font-size:18px;font-weight:700;color:var(--ink)}
.room-card .rc-status{font-size:10px;margin-top:5px;color:var(--aux)}
.room-card.done{border-color:#02C2C2;background:#E6FAF6}
.room-card.done .rc-status{color:var(--green)}
.room-card .rc-check{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#02C2C2,#007878);color:#fff;font-size:10px;display:none;align-items:center;justify-content:center;font-weight:700}
.room-card.done .rc-check{display:flex}
/* Expandable Room List */
.room-block{background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,164,241,.05);border:1px solid rgba(0,164,241,.03);margin-bottom:10px;overflow:hidden}
.room-inline-block{margin-bottom:14px}
.room-block-header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #F5F7FA}
.room-block-header .rb-bar{width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,#00A4F1,#0087C7)}
.room-block-header .rb-title{font-size:15px;font-weight:600;color:var(--ink)}
.room-block-header .rb-stat{margin-left:auto;font-size:12px;color:var(--muted)}
.room-block-header .rb-stat b{color:var(--pm);font-weight:600}
.room-block-body{padding:14px 16px}
/* Room Grid (Block 1) */
.room-grid-q{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.room-tile{position:relative;background:#F7F9FC;border:1.5px solid transparent;border-radius:4px;padding:14px 6px 10px;text-align:center;cursor:pointer;transition:all .15s}
.room-tile:active{transform:scale(.96)}
.room-tile .rt-num{font-size:17px;font-weight:700;color:var(--ink);line-height:1.2}
.room-tile .rt-status{font-size:11px;margin-top:4px;color:var(--aux)}
.room-tile.done{border-color:#02C2C2;background:#E6FAF6}
.room-tile.done .rt-status{color:#02C2C2}
.room-tile.progress{border-color:#FFA64C;background:#FFF7E6}
.room-tile.progress .rt-status{color:#D48806}
.room-tile.active{border-color:var(--pm);background:#E6F7FF;box-shadow:0 2px 8px rgba(0,164,241,.15)}
.room-tile.active .rt-num{color:var(--pm)}
.room-tile .rt-check{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:#02C2C2;color:#fff;font-size:9px;display:none;align-items:center;justify-content:center;font-weight:700}
.room-tile.done .rt-check{display:flex}
/* Room Items (Block 2) */
.room-items-empty{padding:32px 16px;text-align:center;color:var(--aux);font-size:13px;line-height:1.7}
.room-items-empty .rie-icon{font-size:36px;margin-bottom:8px;opacity:.5}
.room-current-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--pm);background:#E6F7FF;padding:5px 12px;border-radius:999px;margin-bottom:12px}
.room-items-list .check-item{background:#F7F9FC;border-radius:4px;padding:12px 14px;margin-bottom:8px}
.room-items-list .check-item:last-child{margin-bottom:0}
/* Manual Score (Block 3) */
.room-score-block .rsb-locked{padding:22px 18px;background:linear-gradient(135deg,#F7F9FC,#F0F4F8);border-radius:4px;text-align:center}
.room-score-block .rsb-locked .rsli-icon{width:44px;height:44px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px;box-shadow:0 2px 8px rgba(134,144,156,.15)}
.room-score-block .rsb-locked .rsli-text{font-size:13px;color:var(--muted);line-height:1.6;font-weight:500}
.room-score-block .rsb-locked .rsli-progress-bar{margin:14px auto 8px;width:100%;max-width:200px;height:6px;background:#E5E9EF;border-radius:999px;overflow:hidden}
.room-score-block .rsb-locked .rsli-progress-fill{height:100%;background:linear-gradient(90deg,#00A4F1,#02C2C2);border-radius:999px;transition:width .4s ease}
.room-score-block .rsb-locked .rsli-progress{font-size:12px;color:var(--aux);font-weight:500}
.room-score-block .rsb-locked .rsli-progress b{color:var(--pm);font-weight:600}
.room-score-card{background:linear-gradient(135deg,#E6F7FF,#F0FAFF);border:1px solid #B8E3F7;border-radius:4px;padding:18px 16px}
.room-score-card .rsc-label{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.room-score-card .rsc-label .rsc-max-tag{margin-left:auto;font-size:11px;color:var(--pm);background:rgba(0,164,241,.1);padding:2px 8px;border-radius:999px;font-weight:600}
.room-score-card .rsc-row{display:flex;align-items:center;justify-content:center;gap:8px}
.room-score-card .rsc-input{width:110px;height:56px;border:2px solid var(--pm);border-radius:4px;text-align:center;font-size:32px;font-weight:800;color:var(--pm);outline:none;background:#fff;-webkit-appearance:none;-moz-appearance:textfield;font-family:inherit;transition:border-color .15s}
.room-score-card .rsc-input:focus{border-color:#0087C7;box-shadow:0 0 0 3px rgba(0,164,241,.12)}
.room-score-card .rsc-input::-webkit-outer-spin-button,.room-score-card .rsc-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.room-score-card .rsc-max{font-size:18px;color:var(--muted);font-weight:600}
.room-score-card .rsc-hint{font-size:11px;color:var(--aux);margin-top:10px;text-align:center}

/* PM Guestroom entry (QC view) */
.pm-guestroom-entry{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:14px 0 4px;background:#fff;border:1px solid #E5E9EF;border-radius:4px;cursor:pointer;transition:all .15s}
.pm-guestroom-entry:active{background:#F5F7FA;transform:scale(.99)}
.pm-guestroom-entry .pmge-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#E6F7FF,#F0FAFF);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pm-guestroom-entry .pmge-text{flex:1;font-size:14px;font-weight:600;color:var(--ink)}
.pm-guestroom-entry .pmge-arrow{font-size:18px;color:var(--aux);flex-shrink:0}

/* ===== Inspection View (sidebar + full expand) ===== */
#page-inspection{overflow:hidden;display:flex;flex-direction:row}
/* Inspection Sidebar - 参考药箱宝风格 */
.insp-sidebar{width:64px;flex-shrink:0;background:#F7FAFE;border-right:none;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:10;position:relative;padding-bottom:132px}
.insp-sidebar::-webkit-scrollbar{display:none}
.insp-sidebar::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,#0087C7 0%,#00A4F1 50%,#A9E4FF 100%)}
.insp-side-item{padding:14px 6px 12px;text-align:center;cursor:pointer;position:relative;transition:all .2s;background:transparent}
.insp-side-item .isi-block{width:44px;height:44px;margin:0 auto;border-radius:8px;background:linear-gradient(135deg,#EDF4FE 0%,#E3EEFB 100%);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;box-shadow:0 2px 8px rgba(0,135,199,.06),inset 0 1px 0 rgba(255,255,255,.8);transition:all .2s}
.insp-side-item .isi-abbr{font-size:11px;font-weight:700;margin-top:6px;letter-spacing:.2px;color:var(--aux);transition:color .2s}
.insp-side-item .isi-dot{width:7px;height:7px;border-radius:50%;margin:6px auto 0;background:#C8D2DC;transition:all .2s}
.insp-side-item .isi-divider{position:absolute;bottom:0;left:10px;right:10px;height:1px;background:linear-gradient(90deg,transparent,rgba(0,135,199,.12),transparent)}
.insp-side-item.active{background:linear-gradient(90deg,rgba(0,164,241,.14) 0%,rgba(0,164,241,.06) 40%,rgba(0,164,241,0) 100%)}
.insp-side-item.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;background:linear-gradient(180deg,#0087C7 0%,#00A4F1 50%,#0087C7 100%);border-radius:0 3px 3px 0;box-shadow:0 0 8px rgba(0,164,241,.4)}
.insp-side-item.active .isi-block{background:linear-gradient(135deg,#00A4F1 0%,#4DB9F7 100%);box-shadow:0 4px 14px rgba(0,164,241,.32),inset 0 1px 0 rgba(255,255,255,.25)}
.insp-side-item.active .isi-abbr{color:#0087C7}
.insp-side-item:active .isi-block{transform:scale(.95)}
.insp-side-subs{display:none;background:rgba(237,244,254,.4);padding:4px 0 8px}
.insp-side-subs.show{display:block}
.insp-side-sub{padding:7px 4px;text-align:center;font-size:10px;font-weight:600;color:var(--aux);cursor:pointer;white-space:nowrap;overflow:hidden;transition:all .15s;position:relative}
.insp-side-sub::after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:1px;background:rgba(0,135,199,.06)}
.insp-side-sub:last-child::after{display:none}
.insp-side-sub:active{background:rgba(0,164,241,.06);color:#0087C7}
.insp-side-sub.active-sub{color:#0087C7;background:linear-gradient(90deg,rgba(0,164,241,.08) 0%,rgba(0,164,241,0) 100%)}
.insp-side-sub.active-sub::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:#00A4F1;border-radius:0 2px 2px 0}
.insp-main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 132px;position:relative}
.insp-main::-webkit-scrollbar{display:none}
.insp-module{margin-bottom:10px}
.insp-module-header{display:flex;align-items:center;gap:10px;padding:16px 18px;background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(0,164,241,.05);border:1px solid rgba(0,164,241,.03);margin-bottom:10px}
.insp-badge{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;letter-spacing:.2px;box-shadow:0 2px 6px rgba(0,164,241,.15)}
.insp-module-header .imh-name{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.insp-module-header .imh-progress{font-size:11px;color:var(--aux);flex-shrink:0}
.insp-module-header .imh-score{font-size:12px;font-weight:700;flex-shrink:0;margin-left:4px;background:#E6F7FF;padding:3px 10px;border-radius:999px}
.insp-module-img{display:block;width:100%;height:auto;max-height:150px;object-fit:cover;border-radius:var(--radius);margin-bottom:10px}
.insp-module-body{padding:0}
.insp-submodule{margin-top:10px}
.insp-sub-header{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
.insp-sub-badge{width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700;flex-shrink:0}
.insp-sub-header .ish-name{font-size:13px;font-weight:600;color:var(--ink);flex-shrink:0}
.insp-sub-header .ish-line{flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent)}
.insp-sub-img{display:block;width:100%;height:auto;max-height:120px;object-fit:cover;border-radius:4px;margin-bottom:10px}

/* ===== HOME PAGE (New Design) ===== */
.home-hero{background:linear-gradient(160deg,#0087C7 0%,#00A4F1 35%,#0087C7 70%,#A9E4FF 100%);padding:52px 18px 60px;position:relative;overflow:visible;flex-shrink:0;height:319px}
.home-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.12) 0%,transparent 70%);border-radius:50%}
.home-hero::after{content:'';position:absolute;bottom:-80px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(169,228,255,.25) 0%,transparent 70%);border-radius:50%}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1;margin-bottom:20px}
.hero-title{font-size:32px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1.2}
.hero-subtitle{font-size:13px;color:rgba(255,255,255,.7);margin-top:6px}
.hero-right{display:flex;gap:10px;align-items:center}
.hero-role-btn{display:flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:4px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all .15s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero-role-btn:active{background:rgba(255,255,255,.28);transform:scale(.95)}
.hero-role-btn .role-label{line-height:1}
.hero-role-btn svg{width:16px;height:16px}
.hero-icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;position:relative;transition:all .15s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero-icon-btn:active{background:rgba(255,255,255,.28);transform:scale(.95)}
.hero-icon-btn svg{width:20px;height:20px}
.badge-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:#FF4C4C;border-radius:50%;border:1.5px solid #00A4F1}
.hero-progress-card{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:14px 16px;position:relative;z-index:1;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,135,199,.15)}
.hpc-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px 4px}
.hpc-stats>#heroFailABlock,.hpc-stats>#heroFailBBlock,.hpc-stats>#heroFailBlock,.hpc-stats>#heroProgressBlock,.hpc-stats>#heroPmBlock,.hpc-stats>#heroQcBlock{grid-column:span 2}
body.role-qc .hpc-stats>#heroProgressBlock{display:none}
body.role-qc .hpc-stats>#heroPmBlock,body.role-qc .hpc-stats>#heroQcBlock{grid-column:span 3}
.hpc-stat-block{text-align:center;min-width:0}
.hpc-stat-label{font-size:10px;color:rgba(255,255,255,.75);margin-bottom:4px;letter-spacing:.2px;line-height:1.2}
.hpc-stat-value-wrap{display:flex;align-items:baseline;justify-content:center;gap:1px}
.hpc-stat-value{font-size:21px;font-weight:800;color:#fff;line-height:1;letter-spacing:-.5px}
.hpc-stat-unit{font-size:11px;font-weight:500;color:rgba(255,255,255,.7)}
.hpc-stat-block.has-fail .hpc-stat-value{color:#FFD2D2}
.hpc-dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:3px;vertical-align:middle}
.hpc-dot-a{background:#02C2C2}
.hpc-dot-b{background:#FFA64C}
.hpc-stat-divider{grid-column:1/-1;height:1px;background:rgba(255,255,255,.12);margin:6px 0}

/* Home Content Area */

function applyRole(){var r=document.querySelector(':root');r.style.setProperty('--role',currentRole==='pm'?'#00A4F1':'#FFA64C');document.body.className=document.body.className.replace(/\brole-\w+\b/g,'').trim();document.body.classList.add('role-'+currentRole);}
function getModule(id){return modules.find(function(m){return m.id===id;});}
function getSubModule(modId,subId){var m=getModule(modId);if(!m||!m.subModules)return null;return m.subModules.find(function(s){return s.id===subId;});}
function itemKey(modId,subId,gi,ii){return modId+'_'+(subId||'0')+'_'+gi+'_'+ii;}
function myResultKey(key){return currentRole==='qc'?'qc_'+key:key;}
function isDeductionItem(key){
  var parts=key.split('_');
  var modId=parts[0],subId=parts[1],gi=parseInt(parts[2]),ii=parseInt(parts[3]);
  var mod=getModule(modId);if(!mod)return false;
  var target=subId&&subId!=='0'?getSubModule(modId,subId):mod;
  if(!target||!target.groups)return false;
  var g=target.groups[gi];if(!g)return false;
  var it=g.items[ii];return !!(it&&it.scoreType==='deduction');
}

function countAllItems(mod){
  if(mod.type==='sub'){
    return mod.subModules.reduce(function(s,sm){return s+countGroupItems(sm.groups);},0);
  }
  return countGroupItems(mod.groups);
}
function countGroupItems(groups){
  return groups.reduce(function(s,g){return s+g.items.length;},0);
}
function countCompleted(mod){
  var total=0;
  if(mod.type==='sub'){
    mod.subModules.forEach(function(sm){
      sm.groups.forEach(function(g,gi){
        g.items.forEach(function(it,ii){
          if(checkResults[myResultKey(itemKey(mod.id,sm.id,gi,ii))])total++;
        });
      });
    });
  }else{
    mod.groups.forEach(function(g,gi){
      g.items.forEach(function(it,ii){
        if(checkResults[myResultKey(itemKey(mod.id,null,gi,ii))])total++;
      });
    });
  }
  return total;
}
function countSubCompleted(modId,subId){
  var mod=getModule(modId);if(!mod||mod.type!=='sub')return 0;
  var c=0;
  var sm=mod.subModules.find(function(s){return s.id===subId;});
  if(!sm)return 0;
  sm.groups.forEach(function(g,gi){
    g.items.forEach(function(it,ii){
      if(checkResults[myResultKey(itemKey(modId,subId,gi,ii))])c++;
    });
  });
  return c;
}

/* ===== SCORING ===== */
function calculatePMScore(){
  var total=0,maxTotal=0;
  var filingScore=20,filingMax=20,filingDeduct=0;
  var details=[];
  modules.forEach(function(mod){
    var iter=function(g,gi,subId){
      g.items.forEach(function(it,ii){
        var key=itemKey(mod.id,subId,gi,ii);
        if(it.scoreType==='deduction'){
          if(checkResults[key]==='fail'){
            filingScore-=it.score;
            filingDeduct+=it.score;
          }
        }else{
          maxTotal+=it.score;
          if(checkResults[key]==='pass')total+=it.score;
          else if(checkResults[key]==='partial')total+=(checkPartialScores[key]||0);
        }
      });
    };
    if(mod.type==='sub'){
      mod.subModules.forEach(function(sm){sm.groups.forEach(function(g,gi){iter(g,gi,sm.id);});});
    }else{
      mod.groups.forEach(function(g,gi){iter(g,gi,null);});
    }
  });
  return {total:total+filingScore,maxTotal:maxTotal+filingMax,regularTotal:total,regularMax:maxTotal,filingScore:filingScore,filingMax:filingMax,filingDeduct:filingDeduct};
}

function calculateQCScore(){
  var total=0,maxTotal=0,checkedCount=0;
  modules.forEach(function(mod){
    var iter=function(g,gi,subId){
      g.items.forEach(function(it,ii){
        var key=itemKey(mod.id,subId,gi,ii);
        var qk='qc_'+key;
        if(checkResults[qk]){
          checkedCount++;
          var sc=it.score||0;
          maxTotal+=sc;
          if(checkResults[qk]==='pass')total+=sc;
          else if(checkResults[qk]==='partial')total+=(checkPartialScores[qk]||0);
        }
      });
    };
    if(mod.type==='sub'){
      mod.subModules.forEach(function(sm){sm.groups.forEach(function(g,gi){iter(g,gi,sm.id);});});
    }else{
      mod.groups.forEach(function(g,gi){iter(g,gi,null);});
    }
  });
  return {total:total,maxTotal:maxTotal,checkedCount:checkedCount};
}

function lightenColor(hex,pct){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  var lr=Math.min(255,Math.round(r+(255-r)*pct/100));
  var lg=Math.min(255,Math.round(g+(255-g)*pct/100));
  var lb=Math.min(255,Math.round(b+(255-b)*pct/100));
  return '#'+[lr,lg,lb].map(function(v){var s=v.toString(16);return s.length<2?'0'+s:s;}).join('');
}
function hexToRgba(hex,a){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function moduleScore(mod){
  var pmTotal=0,pmMax=0,filingDeduct=0,filingMax=20,filingCount=0;
  var iter=function(g,gi,subId){
    g.items.forEach(function(it,ii){
      var key=itemKey(mod.id,subId,gi,ii);
      if(it.scoreType==='deduction'){
        filingCount++;
        if(checkResults[key]!=='pass')filingDeduct+=it.score;
      }else{
        pmMax+=it.score;
        if(checkResults[key]==='pass')pmTotal+=it.score;
        else if(checkResults[key]==='partial')pmTotal+=(checkPartialScores[key]||0);
      }
    });
  };
  if(mod.type==='sub'){
    mod.subModules.forEach(function(sm){sm.groups.forEach(function(g,gi){iter(g,gi,sm.id);});});
  }else{
    mod.groups.forEach(function(g,gi){iter(g,gi,null);});
  }
  if(filingCount>0)return{total:filingMax-filingDeduct,max:filingMax,isFiling:true};
  return{total:pmTotal,max:pmMax,isFiling:false};
}

  fill.style.background=statusColor;
  if(primaryLabel)primaryLabel.textContent='保存客房质检';
}

var sectionDescMap={
  'objective':'实测数据核验',
  'subjective':'观感与功能检查',
  'filing':'证照文件核查'
};
function sectionHeaderHTML(g,hideScore){
  var desc=g.desc||sectionDescMap[g.type]||'';
  var scoreText=hideScore?'':(g.scoreText===undefined?'扣分项：2分/项':g.scoreText);
  var countHTML=scoreText?'<span class="sh-count'+(g.type==='filing'?' deduction':'')+'">'+scoreText+'</span>':'';
  return '<div class="section-header"><span class="sh-bar"></span><span class="sh-tag '+g.type+'">'+g.label+'</span><div class="sh-text"><span class="sh-title">'+g.label+'</span>'+(desc?'<span class="sh-desc">'+desc+'</span>':'')+'</div>'+countHTML+'</div>';
}

function renderGroupsTabs(groups,modId,subId,hideScore){
  var html='<div class="groups-tabs">';
  groups.forEach(function(g,gi){
    html+='<button class="gtab'+(gi===0?' active':'')+'" onclick="switchGroupTab(this,'+gi+')">'+g.label+'</button>';
  });
  html+='</div>';
  groups.forEach(function(g,gi){
    html+='<div class="groups-panel" data-idx="'+gi+'" style="display:'+(gi===0?'block':'none')+'">';
    var desc=g.desc||sectionDescMap[g.type]||'';
    var scoreText=hideScore?'':(g.scoreText===undefined?'':g.scoreText);
    if(desc||scoreText){
      html+='<div class="gp-meta">';
      html+=desc?'<span class="gp-desc">'+desc+'</span>':'<span></span>';
      html+=scoreText?'<span class="gp-score">'+scoreText+'</span>':'';
      html+='</div>';
    }
    g.items.forEach(function(it,ii){
      var key=itemKey(modId,subId,gi,ii);
      if(g.type==='filing')html+=renderFilingItem(key,it);
      else html+=renderCheckItem(key,it);
    });
    html+='</div>';
  });
  return html;
}

function switchGroupTab(btn,idx){
  var wrap=btn.parentNode;
  wrap.querySelectorAll('.gtab').forEach(function(t){t.classList.remove('active');});
  btn.classList.add('active');
  wrap.parentNode.querySelectorAll('.groups-panel').forEach(function(p){
    p.style.display=(p.getAttribute('data-idx')==String(idx))?'block':'none';
  });
}

function renderSidebar(){
  var sb=document.getElementById('inspSidebar');
  if(!sb)return;
  var html='';
  modules.forEach(function(mod){
    var abbr=modulePinyin[mod.id];
    var total=countAllItems(mod);
    var done=countCompleted(mod);
    var pct=total>0?Math.round(done/total*100):0;
    var isAllDone=(done===total&&total>0);
    var dotColor=isAllDone?'#02C2C2':(pct>0?'#FFA64C':'#C8D2DC');
    var hasSub=mod.type==='sub';
    html+='<div class="insp-side-item" id="side_'+mod.id+'" onclick="onSidebarClick(\''+mod.id+'\')" data-status="'+dotColor+'">';
    html+='<div class="isi-block"><span class="isi-emoji">'+mod.icon+'</span></div>';
    html+='<div class="isi-abbr">'+abbr+'</div>';
    html+='<div class="isi-dot" style="background:'+dotColor+'"></div>';
    html+='<div class="isi-divider"></div>';
    html+='</div>';
    if(hasSub){
      html+='<div class="insp-side-subs'+(sidebarExpanded[mod.id]?' show':'')+'" id="sidesub_'+mod.id+'">';
      mod.subModules.forEach(function(sm){
        var sabbr=subModulePinyin[sm.id]||'';
        var stotal=sm.groups.reduce(function(s,g){return s+g.items.length;},0);
        var sdone=countSubCompleted(mod.id,sm.id);
        html+='<div class="insp-side-sub" id="sidesubitem_'+mod.id+'_'+sm.id+'" onclick="event.stopPropagation();onSideSubClick(\''+mod.id+'\',\''+sm.id+'\')">'+sabbr+'<div style="font-size:9px;color:var(--aux);margin-top:2px">'+sdone+'/'+stotal+'</div></div>';
      });
      html+='</div>';
    }
  });
  sb.innerHTML=html;
}

function highlightSidebar(modId){
  document.querySelectorAll('.insp-side-item').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.insp-side-sub').forEach(function(el){el.classList.remove('active-sub');});
  var el=document.getElementById('side_'+modId);
  if(el){
    el.classList.add('active');
  }
  if(currentSubModuleId){
    var subEl=document.getElementById('sidesubitem_'+modId+'_'+currentSubModuleId);
    if(subEl)subEl.classList.add('active-sub');
  }
}

function updateSidebarDots(){
  var pageInsp=document.getElementById('page-inspection');
  if(!pageInsp||!pageInsp.classList.contains('active'))return;
  modules.forEach(function(mod){
    var total=countAllItems(mod);
    var done=countCompleted(mod);
    var pct=total>0?Math.round(done/total*100):0;
    var isAllDone=(done===total&&total>0);
    var dotColor=isAllDone?'#02C2C2':(pct>0?'#FFA64C':'#C8D2DC');
    var item=document.getElementById('side_'+mod.id);
    if(item){
      var dot=item.querySelector('.isi-dot');
      if(dot)dot.style.background=dotColor;
    }
    if(mod.type==='sub'){
      mod.subModules.forEach(function(sm){
        var sub=document.getElementById('sidesubitem_'+mod.id+'_'+sm.id);
        if(sub){
          var stotal=sm.groups.reduce(function(s,g){return s+g.items.length;},0);
          var sdone=countSubCompleted(mod.id,sm.id);
          var last=sub.lastElementChild;
          if(last&&last.tagName==='DIV')last.textContent=sdone+'/'+stotal;
        }
      });
    }
  });
}

function onSideSubClick(modId,subId){
  if(currentModuleId!==modId){
    selectInspectionModule(modId);
  }
  setTimeout(function(){scrollToSubModule(modId,subId);},80);
}

function onSidebarClick(modId){
  var mod=getModule(modId);if(!mod)return;
  if(mod.type==='sub'){
    var el=document.getElementById('sidesub_'+modId);
    if(el){
      sidebarExpanded[modId]=!sidebarExpanded[modId];
      el.classList.toggle('show',sidebarExpanded[modId]);
    }
  }
  selectInspectionModule(modId);
}

function scrollToModule(modId){
  var el=document.getElementById('inspmod_'+modId);
  var main=document.getElementById('inspMain');
  if(!el||!main)return;
  var top=el.getBoundingClientRect().top-main.getBoundingClientRect().top+main.scrollTop;
  main.scrollTo({top:Math.max(top-6,0),behavior:'smooth'});
  highlightSidebar(modId);
}

function scrollToSubModule(modId,subId){
  var el=document.getElementById('inspsub_'+modId+'_'+subId);
  var main=document.getElementById('inspMain');
  if(!el||!main)return;
  var top=el.getBoundingClientRect().top-main.getBoundingClientRect().top+main.scrollTop;
  main.scrollTo({top:Math.max(top-6,0),behavior:'smooth'});
  if(getModule(modId))highlightSidebar(modId);
}

function highlightSidebar(modId){
  document.querySelectorAll('.insp-side-item').forEach(function(el){
    el.classList.remove('active');
    el.style.removeProperty('--sm');
  });
  var el=document.getElementById('side_'+modId);
  if(el){
    el.classList.add('active');
    var mod=getModule(modId);
    if(mod){
      var total=countAllItems(mod);
      var done=countCompleted(mod);
      var pct=total>0?Math.round(done/total*100):0;
      var isAllDone=(done===total&&total>0);
      var c=isAllDone?'#02C2C2':(pct>0?'#FFA64C':'#86909C');
      el.style.setProperty('--sm',c);
    }
  }
}

var inspScrollBound=false;
function bindInspectionScroll(){
  if(inspScrollBound)return;
  inspScrollBound=true;
}

function selectInspectionModule(modId){
  currentModuleId=modId;
  currentSubModuleId=null;
  renderInspectionView(modId);
  highlightSidebar(modId);
  var main=document.getElementById('inspMain');
  if(main)main.scrollTop=0;
  var mod=getModule(modId);
  if(mod){
    document.getElementById('headerTitle').textContent=mod.name;
  }
}

function renderInspectionView(filterModId){
  renderSidebar();
  bindInspectionScroll();
  var main=document.getElementById('inspMain');
  if(!main)return;
  var html='';
  var modsToRender=filterModId?modules.filter(function(m){return m.id===filterModId;}):modules;
  modsToRender.forEach(function(mod){
    var total=countAllItems(mod);
    var done=countCompleted(mod);
    var pct=total>0?Math.round(done/total*100):0;
    var sc=moduleScore(mod);
    var isAllDone=(done===total&&total>0);
    var modColor=isAllDone?'#02C2C2':(pct>0?'#FFA64C':'#86909C');
    var scoreBg=pct>0?hexToRgba(modColor,.08):'#F5F7FA';
    var scoreColor=pct>0?modColor:'#86909C';
    var scoreText=sc.total+'/'+sc.max+'分';
    html+='<div class="insp-module" id="inspmod_'+mod.id+'" data-mod="'+mod.id+'">';
    html+='<div class="insp-module-header">';
    html+='<div class="imh-name">'+mod.icon+' '+mod.name+'</div>';
    html+='<div class="imh-progress">'+done+'/'+total+'项</div>';
    html+='<div class="imh-score" style="background:'+scoreBg+';color:'+scoreColor+'">'+scoreText+'</div>';
    html+='</div>';
    if(mod.img){
      html+='<img class="insp-module-img" src="assets/'+mod.img+'" alt="'+mod.name+'效果图" onerror="this.style.display=\'none\'">';
    }
    if(mod.imgs){
      mod.imgs.forEach(function(im){html+='<img class="insp-module-img" src="assets/'+im+'" alt="'+mod.name+'效果图" onerror="this.style.display=\'none\'">';});
    }
    html+='<div class="insp-module-body">';
    if(mod.type==='sub'){
      mod.subModules.forEach(function(sm){
        var sabbr=subModulePinyin[sm.id]||'';
        var smTotal=countGroupItems(sm.groups);
        var smDone=0;
        sm.groups.forEach(function(g,gi){
          g.items.forEach(function(it,ii){
            var k=myResultKey(itemKey(mod.id,sm.id,gi,ii));
            if(checkResults[k]&&checkResults[k]!=='none')smDone++;
          });
        });
        var smPct=smTotal>0?Math.round(smDone/smTotal*100):0;
        var smAllDone=(smDone===smTotal&&smTotal>0);
        var smColor=smAllDone?'#02C2C2':(smPct>0?'#FFA64C':'#86909C');
        html+='<div class="insp-submodule" id="inspsub_'+mod.id+'_'+sm.id+'">';
        html+='<div class="insp-sub-header">';
        html+='<div class="insp-sub-badge" style="background:'+smColor+'">'+sabbr+'</div>';
        html+='<div class="ish-name">'+sm.name+'</div>';
        html+='<div class="ish-line"></div>';
        html+='</div>';
        if(sm.img){
          html+='<img class="insp-sub-img" src="assets/'+sm.img+'" alt="'+sm.name+'效果图" onerror="this.style.display=\'none\'">';
        }
        if(sm.groups.length>1){
          html+=renderGroupsTabs(sm.groups,mod.id,sm.id,false);
        }else{
          sm.groups.forEach(function(g,gi){
            html+=sectionHeaderHTML(g);
            g.items.forEach(function(it,ii){
              var key=itemKey(mod.id,sm.id,gi,ii);
              if(g.type==='filing')html+=renderFilingItem(key,it);
              else html+=renderCheckItem(key,it);
            });
          });
        }
        html+='</div>';
      });
    }else{
      // QC role + guestroom: insert room sampling block; only show check items after a room is selected
      if(currentRole==='qc'&&mod.id==='guestroom'){
        html+='<div class="pm-guestroom-entry" onclick="showPmGuestroom()"><span class="pmge-icon">📋</span><span class="pmge-text">查看项目经理客房质检详情</span><span class="pmge-arrow">›</span></div>';
        html+=renderRoomSamplingBlock();
        if(expandedRoomIdx===null||roomNumbers.length===0){
          // 未点击具体房号前，不显示检查项
        }else{
          html+='<div class="room-current-tag" style="margin:12px 0">🛏️ '+roomNumbers[expandedRoomIdx]+'号房 · 检查项</div>';
          if(mod.groups.length>1){
            html+=renderGroupsTabs(mod.groups,mod.id,null,true);
          }else{
            mod.groups.forEach(function(g,gi){
              html+=sectionHeaderHTML(g,true);
              g.items.forEach(function(it,ii){
                var key=itemKey(mod.id,null,gi,ii);
                if(g.type==='filing')html+=renderFilingItem(key,it);
                else html+=renderCheckItem(key,it);
              });
            });
          }
        }
      }else{
        if(mod.groups.length>1){
          html+=renderGroupsTabs(mod.groups,mod.id,null,false);
        }else{
          mod.groups.forEach(function(g,gi){
            html+=sectionHeaderHTML(g);
            g.items.forEach(function(it,ii){
              var key=itemKey(mod.id,null,gi,ii);
              if(g.type==='filing')html+=renderFilingItem(key,it);
              else html+=renderCheckItem(key,it);
            });
          });
        }
      }
    }
    html+='</div>';
    html+='</div>';
  });
  main.innerHTML=html;
  // Update bottom bar score for single-module inspection view
  updateBottomBarScore(filterModId);
  modsToRender.forEach(function(mod){
    if(mod.type==='sub'){
      mod.subModules.forEach(function(sm){
        sm.groups.forEach(function(g,gi){
          g.items.forEach(function(it,ii){
            restoreItemState(itemKey(mod.id,sm.id,gi,ii));
          });
        });
      });
    }else{
      mod.groups.forEach(function(g,gi){
        g.items.forEach(function(it,ii){
          restoreItemState(itemKey(mod.id,null,gi,ii));
        });
      });
    }
  });
  highlightSidebar(currentModuleId||modules[0].id);
}

/* ===== ENTER MODULE ===== */
function enterModule(id){
  var mod=getModule(id);if(!mod)return;
  currentModuleId=id;currentSubModuleId=null;
  document.getElementById('headerTitle').textContent=mod.name;
  document.getElementById('backBtn').style.visibility='visible';
  renderInspectionView(id);
  showPage('page-inspection');

}

/* ===== RENDER SUB-MODULE LIST ===== */
function renderSubModuleList(modId){
  var mod=getModule(modId);if(!mod)return;
  var list=document.getElementById('subModuleList');
  var html='';
  mod.subModules.forEach(function(sm){
    var total=countGroupItems(sm.groups);

    sm.groups.forEach(function(g,gi){

        if(checkResults[myResultKey(itemKey(modId,sm.id,gi,ii))])done++;
      });

    html+='<div class="sc-arrow">›</div>';
    html+='</div>';

}

function enterSubModule(modId,subId){
  currentSubModuleId=subId;
  var sm=getSubModule(modId,subId);if(!sm)return;
  document.getElementById('headerTitle').textContent=sm.name;
  renderDetail(modId,subId);
  showPage('page-detail');
}

/* ===== RENDER DETAIL ===== */
function renderDetail(modId,subId){
  var mod=getModule(modId);if(!mod)return;
  var target=subId?getSubModule(modId,subId):mod;
  if(!target)return;
  var body=document.getElementById('detailBody');
  var html='';
  // header
  var total=countGroupItems(target.groups);
  var done=0;
  target.groups.forEach(function(g,gi){
    g.items.forEach(function(it,ii){
      if(checkResults[myResultKey(itemKey(modId,subId,gi,ii))])done++;
    });
  });
  html+='<div class="detail-header"><span class="dh-icon">'+(target.icon||mod.icon)+'</span><span class="dh-name">'+target.name+'</span><span class="dh-count">'+done+'/'+total+'</span></div>';
  // image
  if(target.img){
    html+='<div class="loc-image"><img src="assets/'+target.img+'" alt="'+target.name+'效果图" onerror="this.parentElement.style.display=\'none\'"><div class="loc-img-label">'+target.name+' 效果图参考</div></div>';
  }
  if(target.imgs){
    target.imgs.forEach(function(im){
      html+='<div class="loc-image"><img src="assets/'+im+'" alt="'+target.name+'效果图" onerror="this.parentElement.style.display=\'none\'"><div class="loc-img-label">'+target.name+' 效果图参考</div></div>';
    });
  }
  // groups
  target.groups.forEach(function(g,gi){
    html+=sectionHeaderHTML(g);
    g.items.forEach(function(it,ii){
      var key=itemKey(modId,subId,gi,ii);
      if(g.type==='filing'){
        html+=renderFilingItem(key,it);
      }else{
        html+=renderCheckItem(key,it);
      }
    });
  });
  // Score summary at bottom
  html+=renderScoreSummary(modId,subId);
  body.innerHTML=html;
  // restore state
  target.groups.forEach(function(g,gi){
    g.items.forEach(function(it,ii){
      var key=itemKey(modId,subId,gi,ii);
      restoreItemState(key);
    });
  });
}

function scoreBadge(it){
  return it.scoreTag?'<span class="ci-score">'+it.scoreTag+'</span>':'';
}

function renderCheckItem(key,it){
  var html='<div class="check-item'+(it.isBaseline?' baseline':'')+'" id="item_'+key+'">';
  var hideScore=(currentRole==='qc'&&key.indexOf('guestroom')===0);
  html+='<div class="ci-name">'+(it.isBaseline?'<span class="ci-baseline-tag">底线</span>':'')+(it.category?'<span class="ci-category-tag cat-'+it.category.toLowerCase()+'">'+it.category+'类</span>':'')+'<span class="ci-name-text">'+it.name+'</span>'+(hideScore?'':scoreBadge(it))+'</div>';
  html+='<div class="ci-standard">'+(it.standard||'')+'</div>';
  if(it.tags&&it.tags.length){
    html+='<div class="ci-tags">';
    it.tags.forEach(function(t){html+='<span class="ci-tag">'+t+'</span>';});
    html+='</div>';
  }
  if(it.inputType==='value'){
    var vk=myResultKey(key);
    if(it.areaGroups&&it.areaGroups.length){
      html+='<div class="area-groups">';
      it.areaGroups.forEach(function(ag,ai){
        var agk=key+'_ag_'+ai;
        var agv=checkValues[agk]||'';
        var agr=checkResults[agk];
        html+='<div class="area-group">';
        html+='<div class="area-group-header"><span class="area-group-label">'+ag.label+'</span></div>';
        html+='<div class="area-group-row"><div class="agr-input-wrap"><input type="text" class="agr-input" placeholder="请输入实测面积" value="'+agv+'" oninput="checkValues[\''+agk+'\']=this.value"><span class="agr-unit">m²</span></div></div>';
        html+='<div class="area-group-btns">';
        html+='<button class="agb-btn agb-pass'+(agr==='pass'?' active':'')+'" onclick="setAreaGroupResult(\''+agk+'\',\'pass\')">符合</button>';
        html+='<button class="agb-btn agb-fail'+(agr==='fail'?' active':'')+'" onclick="setAreaGroupResult(\''+agk+'\',\'fail\')">不符合</button>';
        html+='</div></div>';
      });
      html+='</div>';
      // fail section (不符合房号+照片)
      if(it.failSection){
        var failShow=(checkResults[key]==='fail');
        var failRoomKey=key+'_failrooms';
        html+='<div class="area-fail-section" id="areafail_'+key+'" style="display:'+(failShow?'flex':'none')+'">';
        html+='<div class="area-fail-field"><span class="aff-label">不符合房号</span><input type="text" class="aff-input" placeholder="多个房号用逗号分隔，如101,102" value="'+(checkValues[failRoomKey]||'')+'" oninput="checkValues[\''+failRoomKey+'\']=this.value"></div>';
        html+='<div class="area-fail-field"><span class="aff-label">不符合照片</span><div class="area-fail-upload" onclick="document.getElementById(\'areafailfile_'+key+'\').click()"><div class="afu-icon">+</div><div class="afu-text">上传照片</div></div>';
        html+='<input type="file" accept="image/*" capture="environment" id="areafailfile_'+key+'" style="display:none" onchange="onAreaFailPhoto(\''+key+'\',this)">';
        html+='<div class="pu-preview" id="areafailprev_'+key+'"></div></div>';
        html+='</div>';
      }
    }else if(it.dualInput&&it.dualInput.length){
      html+='<div class="value-input-dual">';
      it.dualInput.forEach(function(item,di){
        var isObj=typeof item==='object';
        var lbl=isObj?item.label:item;
        var std=isObj?item.standard:'';
        var dk=key+'_'+di;
        var dvk=myResultKey(dk);
        if(std){
          html+='<div class="vid-row"><span class="vid-std">'+lbl+'：'+std+'</span><input type="text" placeholder="实测：" oninput="onValueInput(\''+dk+'\',this.value)" value="'+(checkValues[dvk]||'')+'"></div>';
        }else{
          html+='<input type="text" placeholder="'+lbl+'：" oninput="onValueInput(\''+dk+'\',this.value)" value="'+(checkValues[dvk]||'')+'">';
        }
      });
      html+='</div>';
    }else{
      html+='<div class="value-input"><input type="text" placeholder="请输入实测值" oninput="onValueInput(\''+key+'\',this.value)" value="'+(checkValues[vk]||'')+'"></div>';
    }
  }
  // QC mode: PM result hidden per request
  var isPartial=it.scoreType==='partial';
  html+='<div class="ci-actions'+(isPartial?' ci-actions-partial':'')+'">';
  html+='<button class="ci-btn pass" id="pass_'+key+'" onclick="setResult(\''+key+'\',\'pass\')">✓ 符合</button>';
  if(isPartial){
    html+='<button class="ci-btn partial" id="partialbtn_'+key+'" onclick="setResult(\''+key+'\',\'partial\')">◐ 比较符合</button>';
  }
  html+='<button class="ci-btn fail" id="fail_'+key+'" onclick="setResult(\''+key+'\',\'fail\')">✗ 不符合</button>';
  html+='</div>';
  if(isPartial){
    var pMin=it.partialMin||0;
    var pMax=it.partialMax||0;
    var defVal=checkPartialScores[myResultKey(key)];
    if(defVal===undefined||defVal===null||isNaN(defVal))defVal=pMax;

function setResult(key,result){
  var rk=myResultKey(key);
  checkResults[rk]=result;
  var passBtn=document.getElementById('pass_'+key);
  var failBtn=document.getElementById('fail_'+key);
  var partialBtn=document.getElementById('partialbtn_'+key);
  var photo=document.getElementById('photo_'+key);
  var partialBox=document.getElementById('partialbox_'+key);
  var areaFail=document.getElementById('areafail_'+key);
  if(passBtn)passBtn.classList.toggle('active',result==='pass');
  if(failBtn)failBtn.classList.toggle('active',result==='fail');
  if(partialBtn)partialBtn.classList.toggle('active',result==='partial');
  if(photo)photo.classList.toggle('show',result==='fail');
  if(partialBox)partialBox.classList.toggle('show',result==='partial');
  if(areaFail)areaFail.style.display=(result==='fail'?'flex':'none');
  // Sync bottom bar score on inspection view
  if(currentModuleId){
    var pageInsp=document.getElementById('page-inspection');
    if(pageInsp&&pageInsp.classList.contains('active')){
      updateBottomBarScore(currentModuleId);
      updateSidebarDots();
    }
  }
}

function setAreaGroupResult(agk,result){
  checkResults[agk]=result;
  // Auto-derive parent result: any fail -> fail; all pass -> pass
  var parentKey=agk.replace(/_ag_\d+$/,'');
  // Find areaGroups definition
  var mod=getModule(currentModuleId);
  if(mod&&mod.groups){
    mod.groups.forEach(function(g){
      if(g.items){
        g.items.forEach(function(it){
          if(it.areaGroups){
            var testKey=itemKey(mod.id,null,mod.groups.indexOf(g),g.items.indexOf(it));
            if(testKey===parentKey){
              var allPass=true;var anyFail=false;
              it.areaGroups.forEach(function(_,ai){
                var subR=checkResults[parentKey+'_ag_'+ai];
                if(subR==='fail'){anyFail=true;}
                if(subR!=='pass'){allPass=false;}
              });
              if(anyFail)checkResults[myResultKey(parentKey)]='fail';
              else if(allPass)checkResults[myResultKey(parentKey)]='pass';
              else delete checkResults[myResultKey(parentKey)];
            }
          }
        });
      }
    });
  }
  if(currentModuleId){
    renderInspectionView(currentModuleId);
    highlightSidebar(currentModuleId);
    updateBottomBarScore(currentModuleId);
    updateSidebarDots();
  }
}

function onAreaFailPhoto(key,input){
  if(!input.files||!input.files.length)return;
  var file=input.files[0];
  var reader=new FileReader();
  reader.onload=function(e){
    var imgKey=key+'_areafailphoto';
    if(!checkPhotos[imgKey])checkPhotos[imgKey]=[];
    checkPhotos[imgKey].push(e.target.result);
    var pv=document.getElementById('areafailprev_'+key);
    if(pv){pv.innerHTML+='<img src="'+e.target.result+'">';}
  };
  reader.readAsDataURL(file);
}

function restoreItemState(key){
  var rk=myResultKey(key);

  if(currentRole==='qc'&&!r&&!isDeductionItem(key)){r='pass';checkResults[rk]='pass';}
  var passBtn=document.getElementById('pass_'+key);

  var photo=document.getElementById('photo_'+key);
  var partialBox=document.getElementById('partialbox_'+key);

  if(partialBtn)partialBtn.classList.toggle('active',r==='partial');
  if(photo)photo.classList.toggle('show',r==='fail');

  if(checkPhotos[rk]&&checkPhotos[rk].length){
    var pv=document.getElementById('preview_'+key);
    if(pv){
      var ph='';
      checkPhotos[rk].forEach(function(d){ph+='<img src="'+d+'">';});

function onValueInput(key,val){

}

function onPartialInput(key,pMin,pMax,val){
  var rk=myResultKey(key);
  var num=parseFloat(val);
  if(isNaN(num))num=pMin;
  if(num<pMin)num=pMin;
  if(num>pMax)num=pMax;
  checkPartialScores[rk]=num;
  var cur=document.getElementById('pscur_'+key);
  if(cur)cur.textContent=num;
  var inp=document.getElementById('psinput_'+key);
  if(inp&&parseFloat(inp.value)!==num)inp.value=num;
  // Sync bottom bar score on inspection view
  if(currentModuleId){
    var pageInsp=document.getElementById('page-inspection');
    if(pageInsp&&pageInsp.classList.contains('active')){
      updateBottomBarScore(currentModuleId);
      updateSidebarDots();
    }
  }
}

function onPhotoUpload(key,input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var pk=myResultKey(key);
    if(!checkPhotos[pk])checkPhotos[pk]=[];
    checkPhotos[pk].push(e.target.result);
    var pv=document.getElementById('preview_'+key);

      var img=document.createElement('img');
      img.src=e.target.result;

    }

  reader.readAsDataURL(file);
}

/* ===== ROOM SAMPLING ===== */
function generateRoomNumbers(){
  var sampleCount=Math.ceil(TOTAL_ROOMS*SAMPLE_RATIO);
  var pool=[];
  for(var i=1;i<=TOTAL_ROOMS;i++)pool.push(i);
  // Fisher-Yates shuffle
  for(var j=pool.length-1;j>0;j--){
    var k=Math.floor(Math.random()*(j+1));
    var tmp=pool[j];pool[j]=pool[k];pool[k]=tmp;
  }
  roomNumbers=pool.slice(0,sampleCount).sort(function(a,b){return a-b;});
}
function roomItemKey(roomIdx,ci){return 'room_'+roomIdx+'_'+ci;}
function roomDoneCount(idx){
  var c=0;
  for(var i=0;i<roomCheckItems.length;i++){
    if(roomCheckResults[roomItemKey(idx,i)])c++;
  }
  return c;
}
function calcRoomScore(idx){
  var earned=0,max=0;
  roomCheckItems.forEach(function(it,ci){
    var s=it.score||0;max+=s;
    var k=roomItemKey(idx,ci);
    var r=roomCheckResults[k];
    if(!r)return;
    if(r==='pass'){earned+=s;}
    else if(r==='partial'){earned+=(roomCheckPartialScores[k]||0);}
  });
  return{earned:Math.round(earned*10)/10,max:Math.round(max*10)/10};
}
function renderRoomSamplingBlock(){
  var isGenerated=roomNumbers.length>0;
  if(!isGenerated){
    // 未生成：只显示生成按钮
    var html='';

    html+='</div></div>';
    return html;
  }
  var sampleCount=Math.ceil(TOTAL_ROOMS*SAMPLE_RATIO);
  var doneTotal=0;
  roomNumbers.forEach(function(rn,idx){if(roomDoneCount(idx)===roomCheckItems.length)doneTotal++;});
  var allDone=(doneTotal===sampleCount&&sampleCount>0);
  var html='';
  // 抽检房号 + 客房打分 整合卡片
  html+='<div class="room-block room-inline-block">';
  html+='<div class="room-block-header"><span class="rb-bar"></span><span class="rb-title">抽检房号</span><span class="rb-stat">已完成 <b>'+doneTotal+'</b> / '+sampleCount+' 间</span></div>';
  html+='<div class="room-block-body">';

  roomNumbers.forEach(function(rn,idx){
    var done=roomDoneCount(idx);

    var tileClass=isDone?'done':(done>0?'progress':'');
    if(isActive)tileClass='active';

    html+='<div class="room-tile '+tileClass+'" onclick="selectRoomInline('+idx+')" id="roomtile_'+idx+'">';
    html+='<div class="rt-check">✓</div>';
    html+='<div class="rt-num">'+rn+'号</div>';
    html+='<div class="rt-status" id="roomstatus_'+idx+'">'+statusText+'</div>';
    html+='</div>';
  });
  html+='</div>';
  html+='</div>';
  // 客房打分（内嵌）
  html+='<div class="room-block-body" style="border-top:1px solid #F5F7FA">';
  var manualScore=roomManualScores[0];
  if(manualScore===undefined||manualScore===null||isNaN(manualScore))manualScore='';
  html+='<div class="room-score-card">';

  html+='<span class="rsc-max">/ 15</span>';

  html+='<div class="rsc-hint">请根据整体检查情况综合打分（支持0.5分步进）</div>';
  html+='</div>';
  html+='</div></div>';
  return html;
