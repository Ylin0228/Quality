    // ===== 未生成：只显示生成按钮 =====
    html+='<div class="room-block">';
    html+='<div class="room-block-header"><span class="rb-bar"></span><span class="rb-title">抽检房号</span></div>';
    html+='<div class="room-block-body" style="padding:30px 16px;text-align:center">';
    html+='<div style="color:var(--aux);font-size:13px;margin-bottom:16px">点击下方按钮生成抽检房号</div>';
    html+='<button class="ri-regen" onclick="generateRooms()">生成抽检房号</button>';
    html+='</div></div>';
  }else{
  // ===== Block 1: 抽检房号 =====
  html+='<div class="room-block">';
  html+='<div class="room-block-header"><span class="rb-bar"></span><span class="rb-title">抽检房号</span><span class="rb-stat">已完成 <b>'+doneTotal+'</b> / '+sampleCount+' 间</span></div>';
  html+='<div class="room-block-body">';
  html+='<div class="room-grid-q">';
  roomNumbers.forEach(function(rn,idx){
    var done=roomDoneCount(idx);
    var isDone=done===roomCheckItems.length;
    var isActive=(expandedRoomIdx===idx);
    var tileClass=isDone?'done':(done>0?'progress':'');
    if(isActive)tileClass='active';
    var statusText=isDone?'已检查':done>0?'检查中':'未检查';
    html+='<div class="room-tile '+tileClass+'" onclick="selectRoom('+idx+')" id="roomtile_'+idx+'">';
    html+='<div class="rt-check">✓</div>';
    html+='<div class="rt-num">'+rn+'号</div>';
    html+='<div class="rt-status" id="roomstatus_'+idx+'">'+statusText+'</div>';
    html+='</div>';
  });
  html+='</div>';
  html+='<button class="ri-regen" style="margin-top:14px" disabled>生成抽检房号</button>';
  html+='</div></div>';
  // ===== Block 2: 检查项 =====
  html+='<div class="room-block">';
  html+='<div class="room-block-header"><span class="rb-bar"></span><span class="rb-title">检查项</span><span class="rb-stat">'+roomCheckItems.length+' 项 / 房</span></div>';
  html+='<div class="room-block-body" id="roomItemsContainer">';
  if(expandedRoomIdx!==null){
    html+=renderRoomItemsHtml(expandedRoomIdx);
  }else{
    html+='<div class="room-items-empty"><div class="rie-icon">👆</div><div>点击上方房号开始检查</div><div style="margin-top:4px;font-size:12px">选择一间房后，检查项将在此显示</div></div>';
  }
  html+='</div></div>';
  // ===== Block 3: 客房打分 =====
  html+='<div class="room-block room-score-block">';
  html+='<div class="room-block-header"><span class="rb-bar"></span><span class="rb-title">客房打分</span><span class="rb-stat">满分 15 分</span></div>';
  html+='<div class="room-block-body">';
  if(allDone){
    var manualScore=roomManualScores[0];
    if(manualScore===undefined||manualScore===null||isNaN(manualScore))manualScore='';
    html+='<div class="room-score-card">';
    html+='<div class="rsc-label">📝 客房综合打分<span class="rsc-max-tag">满分 15 分</span></div>';
    html+='<div class="rsc-row">';
    html+='<input type="number" class="rsc-input" id="roommanualscore" min="0" max="15" step="0.5" value="'+manualScore+'" placeholder="0" oninput="onRoomManualScoreInput(0,this.value)">';
    html+='<span class="rsc-max">/ 15</span>';
    html+='</div>';
    html+='<div class="rsc-hint">所有房号已检查完成，请根据整体检查情况综合打分（支持0.5分步进）</div>';
    html+='</div>';
  }else{
    html+='<div class="rsb-locked"><div class="rsli-icon">🔒</div><div class="rsli-text">完成所有房号检查后解锁打分</div><div class="rsli-progress-bar"><div class="rsli-progress-fill" style="width:'+(sampleCount>0?Math.round(doneTotal/sampleCount*100):0)+'%"></div></div><div class="rsli-progress">当前进度：<b>'+doneTotal+'</b> / '+sampleCount+' 间</div></div>';
  }
  html+='</div></div>';
  }
  document.getElementById('roomsBody').innerHTML=html;
  updateRoomsBottomBar();
}
function selectRoom(idx){
  expandedRoomIdx=(expandedRoomIdx===idx)?null:idx;
  renderRoomsView();
  if(expandedRoomIdx===idx){
    setTimeout(function(){
      var itemsBox=document.getElementById('roomItemsContainer');
      if(itemsBox){
        var rect=itemsBox.getBoundingClientRect();
        if(rect.top<80||rect.top>window.innerHeight*0.5){
          itemsBox.scrollIntoView({behavior:'smooth',block:'start'});
        }
      }
    },60);
  }
}
function renderRoomItemsHtml(idx){
  var html='';
  html+='<div class="room-current-tag">🛏️ '+roomNumbers[idx]+'号房 · 检查项</div>';
  html+='<div class="room-items-list">';
  roomCheckItems.forEach(function(it,ci){
    var key=roomItemKey(idx,ci);
    var r=roomCheckResults[key]||'pass';
    var isPartial=it.scoreType==='partial';
    html+='<div class="check-item" id="roomitem_'+key+'">';
    html+='<div class="ci-name">'+it.name+'</div>';
    html+='<div class="ci-standard">'+it.standard+'</div>';
    html+='<div class="ci-actions'+(isPartial?' ci-actions-partial':'')+'">';
    html+='<button class="ci-btn pass'+(r==='pass'?' active':'')+'" onclick="setRoomResult(\''+key+'\',\'pass\')">✓ 符合</button>';
    if(isPartial){
      html+='<button class="ci-btn partial'+(r==='partial'?' active':'')+'" onclick="setRoomResult(\''+key+'\',\'partial\')">◐ 比较符合</button>';
    }
    html+='<button class="ci-btn fail'+(r==='fail'?' active':'')+'" onclick="setRoomResult(\''+key+'\',\'fail\')">✗ 不符合</button>';
    html+='</div>';
    if(isPartial){
      var pMin=it.partialMin||0;
      var pMax=it.partialMax||0;
      var defVal=roomCheckPartialScores[key];
      if(defVal===undefined||defVal===null||isNaN(defVal))defVal=pMax;
      html+='<div class="partial-score'+(r==='partial'?' show':'')+'" id="roompartialbox_'+key+'">';
      html+='<div class="ps-label">分值范围：'+pMin+' ~ '+pMax+' 分</div>';
      html+='<div class="ps-row">';
      html+='<input type="number" class="ps-input" id="roompsinput_'+key+'" min="'+pMin+'" max="'+pMax+'" step="0.5" value="'+defVal+'" oninput="onRoomPartialInput(\''+key+'\','+pMin+','+pMax+',this.value)">';
      html+='<div class="ps-cur">当前得分：<span id="roompscur_'+key+'">'+defVal+'</span> 分</div>';
      html+='</div></div>';
    }
    html+='<div class="photo-upload'+(r==='fail'?' show':'')+'" id="roomphoto_'+key+'">';
    html+='<div class="pu-label">不符合照片（必传）</div>';
    html+='<div class="pu-area" onclick="document.getElementById(\'roomfile_'+key+'\').click()">';
    html+='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>';
    html+='<div class="pu-text">点击上传照片</div></div>';
    html+='<input type="file" accept="image/*" capture="environment" id="roomfile_'+key+'" style="display:none" onchange="onRoomPhotoUpload(\''+key+'\',this)">';
    html+='<div class="pu-preview" id="roompreview_'+key+'">';
    if(roomCheckPhotos[key]&&roomCheckPhotos[key].length){
      roomCheckPhotos[key].forEach(function(d){html+='<img src="'+d+'">';});
    }
    html+='</div></div></div>';
  });
  html+='</div>';
  return html;
}
function onRoomManualScoreInput(idx,val){
  var num=parseFloat(val);
  if(isNaN(num))num=0;
  if(num<0)num=0;
  if(num>15)num=15;
  roomManualScores[idx]=num;
}
function updateRoomsBottomBar(){
  var label=document.getElementById('bbProgLabel');
  if(!label)return;
  var sampleCount=Math.ceil(TOTAL_ROOMS*SAMPLE_RATIO);
  var doneTotal=0;
  roomNumbers.forEach(function(rn,idx){if(roomDoneCount(idx)===roomCheckItems.length)doneTotal++;});
  updateRoomsBottomBar._lastAllDone=(doneTotal===sampleCount&&sampleCount>0);
  var pct=sampleCount>0?Math.round(doneTotal/sampleCount*100):0;
  var statusColor=doneTotal===sampleCount&&sampleCount>0?'#02C2C2':(doneTotal>0?'#FFA64C':'#86909C');
  label.textContent=doneTotal+'/'+sampleCount+' 间已检';
  document.getElementById('bbProgPct').textContent=pct+'%';
  document.getElementById('bbProgPct').style.color=statusColor;
  document.getElementById('bbProgScore').textContent=doneTotal+'/'+sampleCount+'间';
  document.getElementById('bbProgScore').style.color=statusColor;
  document.getElementById('bbProgScore').style.background=hexToRgba(statusColor,.08);
  var fill=document.getElementById('bbProgFill');
  if(fill){fill.style.width=pct+'%';fill.style.background=statusColor;}
  var primaryLabel=document.getElementById('bbPrimaryLabel');
  if(primaryLabel)primaryLabel.textContent='保存客房质检';
}
function regenerateRooms(){
  roomCheckResults={};roomCheckPhotos={};roomCheckPartialScores={};
  roomManualScores={};expandedRoomIdx=null;
  generateRoomNumbers();
  renderRoomsView();
  showToast('已重新生成'+roomNumbers.length+'个抽检房号');
}
function setRoomResult(key,result){
  var prevDone=false;
  var match=key.match(/^room_(\d+)_/);
  var ridx=match?parseInt(match[1]):null;
  if(ridx!==null){prevDone=(roomDoneCount(ridx)===roomCheckItems.length);}
  roomCheckResults[key]=result;
  // Update buttons live
  var passBtn=document.querySelector('#roomitem_'+key+' .ci-btn.pass');
  var failBtn=document.querySelector('#roomitem_'+key+' .ci-btn.fail');
  var partialBtn=document.querySelector('#roomitem_'+key+' .ci-btn.partial');
  var photo=document.getElementById('roomphoto_'+key);
  var partialBox=document.getElementById('roompartialbox_'+key);
  if(passBtn)passBtn.classList.toggle('active',result==='pass');
  if(failBtn)failBtn.classList.toggle('active',result==='fail');
  if(partialBtn)partialBtn.classList.toggle('active',result==='partial');
  if(photo)photo.classList.toggle('show',result==='fail');
  if(partialBox)partialBox.classList.toggle('show',result==='partial');
  // Update room tile + check if overall completion changed
  if(ridx!==null){
    var done=roomDoneCount(ridx);
    var isDone=done===roomCheckItems.length;
    var tile=document.getElementById('roomtile_'+ridx);
    if(tile){
      var baseClass='room-tile '+(expandedRoomIdx===ridx?'active':(isDone?'done':(done>0?'progress':'')));
      tile.className=baseClass;
    }
    var statusEl=document.getElementById('roomstatus_'+ridx);
    if(statusEl){
      statusEl.textContent=isDone?'已检查':done>0?'检查中':'未检查';
    }
    // Re-render whole view only when overall completion state changes (to unlock score block)
    var sampleCount=Math.ceil(TOTAL_ROOMS*SAMPLE_RATIO);
    var doneTotal=0;
    roomNumbers.forEach(function(rn,idx){if(roomDoneCount(idx)===roomCheckItems.length)doneTotal++;});
    var allDone=(doneTotal===sampleCount&&sampleCount>0);
    var wasAllDone=updateRoomsBottomBar._lastAllDone;
    if(allDone!==wasAllDone){
      updateRoomsBottomBar._lastAllDone=allDone;
      renderRoomsView();
      return;
    }
  }
  updateRoomsBottomBar();
}
function onRoomPhotoUpload(key,input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    if(!roomCheckPhotos[key])roomCheckPhotos[key]=[];
    roomCheckPhotos[key].push(e.target.result);
    var pv=document.getElementById('roompreview_'+key);
    if(pv){var img=document.createElement('img');img.src=e.target.result;pv.appendChild(img);}
    showToast('照片已上传');
  };
  reader.readAsDataURL(file);
}

function onRoomPartialInput(key,pMin,pMax,val){
  var num=parseFloat(val);
  if(isNaN(num))num=pMin;
  if(num<pMin)num=pMin;
  if(num>pMax)num=pMax;
  roomCheckPartialScores[key]=num;
  var cur=document.getElementById('roompscur_'+key);
  if(cur)cur.textContent=num;
  var inp=document.getElementById('roompsinput_'+key);
  if(inp&&parseFloat(inp.value)!==num)inp.value=num;
}

/* ===== UTILS ===== */
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}
function saveProgress(){
  showToast('进度已保存');
  renderModuleList();
}

/* ===== INIT ===== */
applyRole();
renderModuleList();
document.querySelector('.header').style.display='none';
</script>
</body>
</html>
