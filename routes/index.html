<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AI质检 - 开业预验收</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pm:#2478F5;--qc:#FF9500;--role:var(--pm);--bg:#F7F9FC;--card:#fff;--ink:#1D2129;--muted:#6E7681;--aux:#86909C;--rule:#EDF0F5;--green:#36C667;--red:#FF4D4F;--radius:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;max-width:375px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
/* 氛围光晕装饰 - 低透明度蓝色弥散 */
body::before{content:'';position:fixed;top:-60px;left:50%;transform:translateX(-50%);width:380px;height:260px;background:radial-gradient(ellipse at center,rgba(36,120,245,.10) 0%,rgba(36,120,245,.04) 40%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-80px;left:50%;transform:translateX(-50%);width:340px;height:220px;background:radial-gradient(ellipse at center,rgba(36,120,245,.05) 0%,transparent 65%);pointer-events:none;z-index:0}

/* Header - 顶部毛玻璃质感 */
.header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:375px;height:52px;background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;padding:0 16px;z-index:100;-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid rgba(36,120,245,.06)}
.header .back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;color:var(--ink);position:absolute;left:8px;border-radius:50%;transition:background .15s}
.header .back-btn:active{background:#F0F4FA}
.header .back-btn svg{width:20px;height:20px;stroke-width:2.2}
.header .title{font-size:17px;font-weight:600;color:var(--ink);text-align:center;letter-spacing:.2px}
.header .role-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:none;background:#F0F4FA;border-radius:50%;cursor:pointer;color:var(--pm);position:absolute;right:12px;transition:all .15s}
.header .role-btn:active{background:#E4ECFA;transform:scale(.95)}
.header .role-btn svg{width:18px;height:18px;stroke-width:1.8}

/* Role Menu */
.role-menu{position:fixed;top:56px;right:12px;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(36,120,245,.12);z-index:200;display:none;overflow:hidden;min-width:150px;border:1px solid var(--rule)}
.role-menu.show{display:block;animation:menuIn .2s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.role-menu-item{padding:12px 18px;display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;border-bottom:1px solid #F5F7FA}
.role-menu-item:last-child{border-bottom:none}
.role-menu-item:active{background:#F5F8FF}
.role-menu-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.role-menu-item .dot.pm{background:var(--pm)}
.role-menu-item .dot.qc{background:var(--qc)}
.role-menu-item.active{font-weight:600;color:var(--pm)}

/* Pages */
.page{position:fixed;top:52px;left:50%;transform:translateX(-50%);width:100%;max-width:375px;bottom:0;background:transparent;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .28s ease,visibility 0s .28s;visibility:hidden;pointer-events:none;z-index:10}
.page.active{transform:translateX(-50%) translateY(0);visibility:visible;pointer-events:auto;transition:transform .28s ease,visibility 0s 0s}
.page::-webkit-scrollbar{display:none}
.page-inner{padding:16px 14px 92px}

/* Home page: flex layout for fixed hero + scrollable content */
.page-home{top:0;display:flex;flex-direction:column;overflow:hidden}
.page-home .home-content{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.page-home .home-content::-webkit-scrollbar{display:none}

/* Status Bar - 蓝色角色卡片，内部柔和渐变 + 毛玻璃质感 */
.status-bar{background:linear-gradient(135deg,rgba(36,120,245,.92) 0%,rgba(74,155,255,.88) 60%,rgba(110,175,255,.85) 100%);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(36,120,245,.22),inset 0 1px 0 rgba(255,255,255,.18);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.status-bar::before{content:'';position:absolute;top:-30px;right:-25px;width:110px;height:110px;background:radial-gradient(circle,rgba(255,255,255,.18) 0%,transparent 70%);border-radius:50%}
.status-bar::after{content:'';position:absolute;bottom:-40px;right:30px;width:80px;height:80px;background:radial-gradient(circle,rgba(255,255,255,.10) 0%,transparent 70%);border-radius:50%}
.status-bar .sb-left{display:flex;flex-direction:column;gap:5px;position:relative;z-index:1}
.status-bar .sb-label{font-size:12px;color:rgba(255,255,255,.82);letter-spacing:.2px}
.status-bar .sb-value{font-size:18px;font-weight:700;color:#fff}
.status-bar .sb-right{text-align:right;position:relative;z-index:1}
.status-bar .sb-pct{font-size:30px;font-weight:800;color:#fff;line-height:1;letter-spacing:-.5px}
.status-bar .sb-pct-label{font-size:11px;color:rgba(255,255,255,.78);margin-top:3px}

/* Score Summary */
.score-summary{background:#fff;border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(36,120,245,.05);border:1px solid rgba(36,120,245,.03)}
.score-summary .ss-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.score-summary .ss-label{font-size:13px;color:var(--muted)}
.score-summary .ss-value{font-size:15px;font-weight:600}
.score-summary .ss-value.pm{color:var(--pm)}
.score-summary .ss-value.qc{color:var(--qc)}

/* Module Cards Grid */
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.module-card{background:#fff;border-radius:var(--radius);padding:20px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .2s;box-shadow:0 2px 12px rgba(36,120,245,.05);position:relative;overflow:hidden;border:1px solid rgba(36,120,245,.03)}
.module-card:active{transform:scale(.97);box-shadow:0 1px 6px rgba(36,120,245,.08)}
.module-card .mc-icon{font-size:28px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EBF3FF 0%,#F2F7FF 100%);border-radius:14px;margin-bottom:4px}
.module-card .mc-name{font-size:14px;font-weight:600;color:var(--ink)}
.module-card .mc-count{font-size:11px;color:var(--aux)}
.module-card .mc-progress{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--pm),#4A9BFF);border-radius:0 0 3px 0}
.module-card .mc-badge{position:absolute;top:10px;right:10px;background:#F0F4FA;border-radius:10px;padding:2px 8px;font-size:10px;color:var(--aux);font-weight:500}
.module-card .mc-done{position:absolute;bottom:8px;right:10px;font-size:10px;color:var(--pm);font-weight:600;background:#EBF3FF;padding:2px 8px;border-radius:8px}

/* Sub-module List */
.sub-list{display:flex;flex-direction:column;gap:12px}
.sub-card{background:#fff;border-radius:var(--radius);padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 2px 12px rgba(36,120,245,.05);transition:all .15s;border:1px solid rgba(36,120,245,.03)}
.sub-card:active{transform:scale(.98)}
.sub-card .sc-icon{font-size:24px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EBF3FF 0%,#F2F7FF 100%);border-radius:12px;flex-shrink:0}
.sub-card .sc-info{flex:1}
.sub-card .sc-name{font-size:15px;font-weight:600;color:var(--ink)}
.sub-card .sc-count{font-size:12px;color:var(--aux);margin-top:3px}
.sub-card .sc-arrow{color:var(--aux);font-size:22px;font-weight:300}
.sub-card .sc-progress-bar{width:50px;height:4px;background:#EDF0F5;border-radius:2px;margin-top:6px;overflow:hidden}
.sub-card .sc-progress-fill{height:100%;background:linear-gradient(90deg,var(--pm),#4A9BFF);border-radius:2px;transition:width .3s}

/* Detail Page */
.detail-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.detail-header .dh-icon{font-size:22px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EBF3FF 0%,#F2F7FF 100%);border-radius:12px;flex-shrink:0}
.detail-header .dh-name{font-size:18px;font-weight:700;flex:1;color:var(--ink)}
.detail-header .dh-count{font-size:12px;color:var(--pm);background:#EBF3FF;padding:4px 12px;border-radius:999px;font-weight:600}

/* Location Image */
.loc-image{border-radius:var(--radius);overflow:hidden;margin-bottom:16px;box-shadow:0 4px 16px rgba(36,120,245,.1);position:relative}
.loc-image img{display:block;width:100%;height:auto}
.loc-image .loc-img-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(29,33,41,.7));color:#fff;font-size:12px;padding:28px 14px 10px;font-weight:500}

/* Section Header - 胶囊标签，弱化分割线，留白区分 */
.section-header{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.section-header .sh-tag{font-size:12px;font-weight:600;padding:5px 14px;border-radius:999px;color:#fff;letter-spacing:.3px}
.section-header .sh-tag.objective{background:linear-gradient(135deg,#2478F5,#4A9BFF)}
.section-header .sh-tag.subjective{background:linear-gradient(135deg,#7B6BFF,#9B8FFF)}
.section-header .sh-tag.filing{background:linear-gradient(135deg,#FF9500,#FFB950)}
.section-header .sh-line{flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent)}
.section-header .sh-count{font-size:12px;color:var(--aux)}

/* Check Item */
.check-item{background:#fff;border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(36,120,245,.05);position:relative;border:1px solid rgba(36,120,245,.03)}
.check-item.baseline{border-left:3px solid var(--red);padding-left:17px}
.check-item .ci-name{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px;color:var(--ink);line-height:1.5}
.check-item .ci-baseline-tag{font-size:10px;color:#fff;background:linear-gradient(135deg,#FF4D4F,#FF7875);padding:2px 8px;border-radius:999px;font-weight:500;flex-shrink:0}
.check-item .ci-score{font-size:11px;font-weight:500;color:var(--pm);background:#EBF3FF;padding:2px 10px;border-radius:999px;margin-left:auto;flex-shrink:0;white-space:nowrap}
.check-item .ci-standard{font-size:12px;color:var(--muted);line-height:1.7}
.check-item .ci-design{font-size:12px;color:var(--pm);margin-top:4px}
.ci-actions{display:flex;gap:8px;margin-top:12px}
.ci-btn{flex:1;height:38px;border:1.5px solid var(--rule);border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;background:#FAFBFD;color:var(--muted);transition:all .18s;display:flex;align-items:center;justify-content:center;gap:4px;font-family:inherit}
.ci-btn.pass.active{background:linear-gradient(135deg,#EBFFF0,#F0FFF5);border-color:#95DE64;color:var(--green)}
.ci-btn.fail.active{background:linear-gradient(135deg,#FFF1F0,#FFF7F7);border-color:#FF7875;color:var(--red)}
.ci-btn.partial.active{background:linear-gradient(135deg,#FFF7E6,#FFFBEB);border-color:#FFC069;color:#D48806}
.ci-btn:active{transform:scale(.97)}

/* Partial (比较符合) Score Input */
.ci-actions-partial{gap:6px}
.ci-actions-partial .ci-btn.pass{flex:0 0 28%}
.ci-actions-partial .ci-btn.partial{flex:0 0 40%}
.ci-actions-partial .ci-btn.fail{flex:0 0 28%}
.partial-score{display:none;margin-top:10px;background:linear-gradient(135deg,#FFFBEB,#FFF7E6);border:1px solid #FFE7BA;border-radius:12px;padding:12px 14px}
.partial-score.show{display:block}
.partial-score .ps-label{font-size:12px;color:#D48806;margin-bottom:8px;font-weight:500}
.partial-score .ps-row{display:flex;align-items:center;gap:10px}
.partial-score .ps-input{width:80px;height:40px;border:1.5px solid #FFD591;border-radius:10px;text-align:center;font-size:18px;font-weight:700;color:#D48806;outline:none;background:#fff;-webkit-appearance:none;-moz-appearance:textfield;font-family:inherit}
.partial-score .ps-input::-webkit-outer-spin-button,.partial-score .ps-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.partial-score .ps-cur{font-size:13px;color:#D48806;font-weight:600;flex:1}

/* PM Result (QC read-only) */
.ci-pm-result{font-size:12px;padding:5px 12px;border-radius:999px;margin-top:10px;display:inline-flex;align-items:center;gap:4px;font-weight:500}
.ci-pm-result.pm-pass{background:#F0FFF5;color:var(--green)}
.ci-pm-result.pm-fail{background:#FFF1F0;color:var(--red)}
.ci-pm-result.pm-partial{background:#FFF7E6;color:#D48806}
.ci-pm-result.pm-none{background:#F5F7FA;color:var(--aux)}

/* Photo Upload */
.photo-upload{display:none;margin-top:12px}
.photo-upload.show{display:block}
.photo-upload .pu-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.photo-upload .pu-area{border:1.5px dashed #C5D8F5;border-radius:12px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;background:#F8FBFF}
.photo-upload .pu-area:active{border-color:var(--pm);background:#EBF3FF}
.photo-upload .pu-area svg{width:28px;height:28px;color:var(--pm);margin-bottom:6px}
.photo-upload .pu-area .pu-text{font-size:12px;color:var(--muted)}
.photo-upload .pu-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photo-upload .pu-preview img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--rule)}

/* Filing Item */
.filing-item{background:#fff;border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(36,120,245,.05);border:1px solid rgba(36,120,245,.03)}
.filing-item .fi-name{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--ink);line-height:1.5}
.filing-item .fi-name .ci-score{font-size:11px;font-weight:500;color:var(--pm);background:#EBF3FF;padding:2px 10px;border-radius:999px;margin-left:auto;flex-shrink:0;white-space:nowrap}
.filing-item .fi-dir{font-size:12px;color:var(--pm);margin-bottom:4px;font-weight:500}
.filing-item .fi-desc{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px}

/* Value Input */
.value-input{margin-top:10px}
.value-input .vi-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.value-input input{width:100%;height:40px;border:1.5px solid var(--rule);border-radius:10px;padding:0 14px;font-size:14px;color:var(--ink);outline:none;background:#FAFBFD;font-family:inherit;transition:border-color .2s}
.value-input input:focus{border-color:var(--pm);background:#fff;box-shadow:0 0 0 3px rgba(36,120,245,.08)}

/* IT Placeholder */
.it-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.it-placeholder .it-icon{font-size:48px;margin-bottom:12px;opacity:.3}
.it-placeholder .it-text{font-size:14px;color:var(--muted)}
.it-placeholder .it-sub{font-size:12px;color:#BCC4D0;margin-top:4px}

/* Score Detail (bottom of detail page) */
.score-detail{background:#fff;border-radius:var(--radius);padding:18px 20px;margin-top:16px;box-shadow:0 2px 12px rgba(36,120,245,.05);border:1px solid rgba(36,120,245,.03)}
.score-detail .sd-title{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.score-detail .sd-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.score-detail .sd-row .sd-label{color:var(--muted)}
.score-detail .sd-row .sd-val{font-weight:600}
.score-detail .sd-row .sd-val.pm{color:var(--pm)}
.score-detail .sd-row .sd-val.qc{color:var(--qc)}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(29,33,41,.85);color:#fff;padding:10px 24px;border-radius:24px;font-size:13px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;backdrop-filter:blur(8px)}
.toast.show{opacity:1}

/* Bottom Bar - 毛玻璃质感 */
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:375px;background:rgba(255,255,255,.88);border-top:1px solid rgba(36,120,245,.06);padding:10px 14px;display:flex;gap:10px;z-index:90;-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%)}
.bb-btn{height:42px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.bb-btn.primary{flex:2;background:linear-gradient(135deg,#2478F5 0%,#4A9BFF 100%);color:#fff;box-shadow:0 4px 14px rgba(36,120,245,.3)}
.bb-btn.primary:active{transform:scale(.97);box-shadow:0 2px 6px rgba(36,120,245,.2)}
.bb-btn.secondary{flex:1;background:#F0F4FA;color:var(--ink)}
.bb-btn.secondary:active{background:#E4ECFA}

/* Room Sampling */
.room-info{background:#fff;border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:0 2px 12px rgba(36,120,245,.05);border:1px solid rgba(36,120,245,.03)}
.room-info .ri-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.room-info .ri-label{font-size:13px;color:var(--muted)}
.room-info .ri-value{font-size:15px;font-weight:600;color:var(--ink)}
.room-info .ri-tip{font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px;padding:10px 14px;background:#F5F8FF;border-radius:12px}
.room-info .ri-regen{margin-top:14px;height:40px;border:1.5px solid var(--pm);background:#fff;color:var(--pm);border-radius:12px;font-size:13px;cursor:pointer;width:100%;font-weight:500;font-family:inherit;transition:all .15s}
.room-info .ri-regen:active{background:#EBF3FF;transform:scale(.98)}
.room-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.room-card{background:#fff;border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(36,120,245,.05);transition:all .15s;position:relative;border:1.5px solid transparent}
.room-card:active{transform:scale(.95)}
.room-card .rc-num{font-size:18px;font-weight:700;color:var(--ink)}
.room-card .rc-status{font-size:10px;margin-top:5px;color:var(--aux)}
.room-card.done{border-color:#95DE64;background:linear-gradient(135deg,#F0FFF5,#FAFFFB)}
.room-card.done .rc-status{color:var(--green)}
.room-card .rc-check{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#36C667,#5AD68A);color:#fff;font-size:10px;display:none;align-items:center;justify-content:center;font-weight:700}
.room-card.done .rc-check{display:flex}

/* ===== Inspection View (sidebar + full expand) ===== */
#page-inspection{overflow:hidden;display:flex;flex-direction:row}
.insp-sidebar{width:50px;flex-shrink:0;background:#fff;border-right:1px solid var(--rule);overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:10}
.insp-sidebar::-webkit-scrollbar{display:none}
.insp-side-item{padding:12px 4px;text-align:center;cursor:pointer;position:relative;border-bottom:1px solid #F5F7FA;transition:all .18s}
.insp-side-item .isi-icon{font-size:16px;line-height:1.2}
.insp-side-item .isi-abbr{font-size:10px;font-weight:700;margin-top:4px;letter-spacing:.2px;color:var(--aux)}
.insp-side-item.active{background:linear-gradient(180deg,#EBF3FF,#F5F8FF)}
.insp-side-item.active .isi-abbr{color:var(--pm)}
.insp-side-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:linear-gradient(180deg,var(--pm),#4A9BFF);border-radius:0 2px 2px 0}
.insp-side-subs{display:none;background:#FAFBFD}
.insp-side-subs.show{display:block}
.insp-side-sub{padding:8px 2px;text-align:center;font-size:10px;font-weight:600;color:var(--aux);cursor:pointer;border-bottom:1px solid #F0F4FA;white-space:nowrap;overflow:hidden;transition:all .1s}
.insp-side-sub:active{background:#F0F4FA;color:var(--pm)}
.insp-main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 12px 92px;position:relative}
.insp-main::-webkit-scrollbar{display:none}
.insp-module{background:#fff;border-radius:var(--radius);margin-bottom:16px;box-shadow:0 2px 12px rgba(36,120,245,.05);overflow:hidden;border:1px solid rgba(36,120,245,.03)}
.insp-module-header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid #F5F7FA}
.insp-badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;letter-spacing:.2px;box-shadow:0 2px 6px rgba(36,120,245,.15)}
.insp-module-header .imh-name{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.insp-module-header .imh-progress{font-size:11px;color:var(--aux);flex-shrink:0}
.insp-module-header .imh-score{font-size:12px;font-weight:700;color:var(--pm);flex-shrink:0;margin-left:4px;background:#EBF3FF;padding:3px 10px;border-radius:999px}
.insp-module-img{display:block;width:100%;height:auto;max-height:150px;object-fit:cover}
.insp-module-body{padding:8px 16px 18px}
.insp-submodule{margin-top:8px}
.insp-sub-header{display:flex;align-items:center;gap:8px;margin:18px 0 12px}
.insp-sub-badge{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700;flex-shrink:0}
.insp-sub-header .ish-name{font-size:13px;font-weight:600;color:var(--ink);flex-shrink:0}
.insp-sub-header .ish-line{flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent)}
.insp-sub-img{display:block;width:100%;height:auto;max-height:120px;object-fit:cover;border-radius:12px;margin-bottom:10px}

/* ===== HOME PAGE (New Design) ===== */
.home-hero{background:linear-gradient(160deg,#1664E8 0%,#2478F5 35%,#4A9BFF 70%,#6DB3FF 100%);padding:52px 18px 60px;position:relative;overflow:hidden;flex-shrink:0}
.home-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.12) 0%,transparent 70%);border-radius:50%}
.home-hero::after{content:'';position:absolute;bottom:-80px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(109,179,255,.25) 0%,transparent 70%);border-radius:50%}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1;margin-bottom:20px}
.hero-sysname{font-size:13px;color:rgba(255,255,255,.78);font-weight:500;letter-spacing:1px;margin-bottom:4px}
.hero-title{font-size:32px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1.2}
.hero-subtitle{font-size:13px;color:rgba(255,255,255,.7);margin-top:6px}
.hero-right{display:flex;gap:10px;align-items:center}
.hero-icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;position:relative;transition:all .15s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero-icon-btn:active{background:rgba(255,255,255,.28);transform:scale(.95)}
.hero-icon-btn svg{width:20px;height:20px}
.badge-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:#FF4D4F;border-radius:50%;border:1.5px solid #2478F5}
.hero-progress-card{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:18px;position:relative;z-index:1;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,50,150,.15)}
.hpc-ring{position:relative;width:60px;height:60px;flex-shrink:0}
.hpc-ring .ring-svg{width:60px;height:60px}
.ring-text{position:absolute;top:0;left:0;width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.hpc-info{flex:1;min-width:0}
.hpc-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hpc-title{font-size:16px;font-weight:600;color:#fff}
.hpc-score{font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18)}
.hpc-sub{font-size:12px;color:rgba(255,255,255,.8);margin-bottom:10px}
.hpc-bar{width:100%;height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.hpc-bar-fill{height:100%;background:#fff;border-radius:3px;transition:width .5s ease}

/* Home Content Area */
.home-content{padding:16px 14px 30px;background:var(--bg);border-radius:24px 24px 0 0;margin-top:-24px;position:relative;z-index:2;min-height:calc(100vh - 280px)}
.search-bar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:0 16px;height:44px;box-shadow:0 2px 12px rgba(36,120,245,.06);margin-bottom:16px;border:1px solid rgba(36,120,245,.04)}
.search-icon{width:18px;height:18px;color:var(--aux);flex-shrink:0}
.search-input{flex:1;border:none;outline:none;font-size:14px;color:var(--ink);background:none;font-family:inherit;height:100%}
.search-input::placeholder{color:var(--aux)}

/* Module List (Single Column) */
.module-list{display:flex;flex-direction:column;gap:12px}
.mod-card{background:#fff;border-radius:var(--radius);padding:18px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;box-shadow:0 2px 12px rgba(36,120,245,.05);transition:all .2s;border:1px solid rgba(36,120,245,.03);position:relative;overflow:hidden}
.mod-card:active{transform:scale(.98);box-shadow:0 1px 6px rgba(36,120,245,.08)}
.mod-card .mc-icon-box{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 4px 12px rgba(36,120,245,.12);position:relative;overflow:hidden}
.mod-card .mc-icon-box::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25) 0%,transparent 50%)}
.mod-card .mc-mid{flex:1;min-width:0}
.mod-card .mc-name{font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mod-card .mc-name .done-tag{font-size:10px;font-weight:600;color:#36C667;background:#EBFFF0;padding:2px 8px;border-radius:999px}
.mod-card .mc-stats{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.mod-card .mc-tags{display:flex;flex-wrap:wrap;gap:6px}
.mod-card .mc-tag{font-size:11px;font-weight:600;padding:2px 10px;border-radius:999px;background:#F5F8FF;color:var(--pm);letter-spacing:.3px}
.mod-card .mc-tag.done{background:#EBFFF0;color:#36C667}
.mod-card .mc-tag.sub{background:#FFF7E6;color:#D48806}
.mod-card .mc-right{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.mod-card .mc-ring{position:relative;width:56px;height:56px}
.mod-card .mc-ring svg{display:block}
.mod-card .mc-ring .ring-pct{position:absolute;top:0;left:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.mod-card .mc-score{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}

/* Hide old home elements that are replaced */
#page-modules .status-bar,
#page-modules .score-summary,
#page-modules .module-grid{display:none!important}
</style>
</head>

/* ===== KEY HELPERS ===== */
function applyRole(){var r=document.querySelector(':root');r.style.setProperty('--role',currentRole==='pm'?'#2478F5':'#FF9500');}
function getModule(id){return modules.find(function(m){return m.id===id;});}
function getSubModule(modId,subId){var m=getModule(modId);if(!m||!m.subModules)return null;return m.subModules.find(function(s){return s.id===subId;});}
function itemKey(modId,subId,gi,ii){return modId+'_'+(subId||'0')+'_'+gi+'_'+ii;}
function myResultKey(key){return currentRole==='qc'?'qc_'+key:key;}
function isDeductionItem(key){
  var parts=key.split('_');
  var modId=parts[0],subId=parts[1],gi=parseInt(parts[2]),ii=parseInt(parts[3]);
  var mod=getModule(modId);if(!mod)return false;
  var target=subId&&subId!=='0'?getSubModule(modId,subId):mod;
  if(!target||!target.groups)return false;
  var g=target.groups[gi];if(!g)return false;
  var it=g.items[ii];return !!(it&&it.scoreType==='deduction');
}

function countAllItems(mod){
  if(mod.type==='sub'){
    return mod.subModules.reduce(function(s,sm){return s+countGroupItems(sm.groups);},0);
  }
  return countGroupItems(mod.groups);
}
function countGroupItems(groups){
  return groups.reduce(function(s,g){return s+g.items.length;},0);
}
function countCompleted(mod){
  var total=0;
  if(mod.type==='sub'){
    mod.subModules.forEach(function(sm){
      sm.groups.forEach(function(g,gi){
        g.items.forEach(function(it,ii){
          if(checkResults[myResultKey(itemKey(mod.id,sm.id,gi,ii))])total++;
        });
      });
    });
  }else{
    mod.groups.forEach(function(g,gi){
      g.items.forEach(function(it,ii){
        if(checkResults[myResultKey(itemKey(mod.id,null,gi,ii))])total++;
      });
    });
  }
  return total;
}

/* ===== SCORING ===== */
function calculatePMScore(){
  var total=0,maxTotal=0;
  var filingScore=20,filingMax=20,filingDeduct=0;
  var details=[];
  modules.forEach(function(mod){
    var iter=function(g,gi,subId){
      g.items.forEach(function(it,ii){
        var key=itemKey(mod.id,subId,gi,ii);
        if(it.scoreType==='deduction'){
          if(checkResults[key]==='fail'){
            filingScore-=it.score;
            filingDeduct+=it.score;
          }
        }else{
          maxTotal+=it.score;
          if(checkResults[key]==='pass')total+=it.score;
          else if(checkResults[key]==='partial')total+=(checkPartialScores[key]||0);
        }
      });
    };
    if(mod.type==='sub'){
      mod.subModules.forEach(function(sm){sm.groups.forEach(function(g,gi){iter(g,gi,sm.id);});});
    }else{
      mod.groups.forEach(function(g,gi){iter(g,gi,null);});
    }
  });
  return {total:total+filingScore,maxTotal:maxTotal+filingMax,regularTotal:total,regularMax:maxTotal,filingScore:filingScore,filingMax:filingMax,filingDeduct:filingDeduct};
}

function calculateQCScore(){
  var total=0,maxTotal=0,checkedCount=0;
  modules.forEach(function(mod){
    var iter=function(g,gi,subId){
      g.items.forEach(function(it,ii){
        var key=itemKey(mod.id,subId,gi,ii);
        var qk='qc_'+key;
        if(checkResults[qk]){
          checkedCount++;
          var sc=it.score||0;
          maxTotal+=sc;
          if(checkResults[qk]==='pass')total+=sc;
          else if(checkResults[qk]==='partial')total+=(checkPartialScores[qk]||0);
        }
      });
    };
    if(mod.type==='sub'){
      mod.subModules.forEach(function(sm){sm.groups.forEach(function(g,gi){iter(g,gi,sm.id);});});
    }else{
      mod.groups.forEach(function(g,gi){iter(g,gi,null);});
    }
  });
  return {total:total,maxTotal:maxTotal,checkedCount:checkedCount};
}

  var mod=getModule(modId);if(!mod)return '';
  var target=subId?getSubModule(modId,subId):mod;
  if(!target||!target.groups)return '';
  var pmTotal=0,pmMax=0;
  var qcTotal=0,qcMax=0,qcChecked=0;
  var filingDeduct=0,filingMax=20,filingCount=0;
  target.groups.forEach(function(g,gi){
    g.items.forEach(function(it,ii){
      var key=itemKey(modId,subId,gi,ii);
      if(it.scoreType==='deduction'){
        filingCount++;
        if(checkResults[key]!=='pass')filingDeduct+=it.score;
      }else{
        pmMax+=it.score;
        if(checkResults[key]==='pass')pmTotal+=it.score;
        else if(checkResults[key]==='partial')pmTotal+=(checkPartialScores[key]||0);
      }
      if(checkResults['qc_'+key]){

function ringSVG(size,color,pct,bg){
  var r=Math.round((size-4.5)/2);
  var circ=2*Math.PI*r;
  var off=circ*(1-pct/100);
  var c=size/2;
  var bgColor=bg||'#EDF0F5';
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'"><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+bgColor+'" stroke-width="4.5"/><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+c+' '+c+'"/></svg>';
}

function lightenColor(hex,pct){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  var lr=Math.min(255,Math.round(r+(255-r)*pct/100));
  var lg=Math.min(255,Math.round(g+(255-g)*pct/100));
  var lb=Math.min(255,Math.round(b+(255-b)*pct/100));
  return '#'+[lr,lg,lb].map(function(v){var s=v.toString(16);return s.length<2?'0'+s:s;}).join('');
}
function hexToRgba(hex,a){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function moduleScore(mod){
  var pmTotal=0,pmMax=0,filingDeduct=0,filingMax=20,filingCount=0;
  var iter=function(g,gi,subId){
    g.items.forEach(function(it,ii){
      var key=itemKey(mod.id,subId,gi,ii);
      if(it.scoreType==='deduction'){
        filingCount++;
        if(checkResults[key]!=='pass')filingDeduct+=it.score;
      }else{
        pmMax+=it.score;
        if(checkResults[key]==='pass')pmTotal+=it.score;
        else if(checkResults[key]==='partial')pmTotal+=(checkPartialScores[key]||0);
      }
    });
  };
  if(mod.type==='sub'){
    mod.subModules.forEach(function(sm){sm.groups.forEach(function(g,gi){iter(g,gi,sm.id);});});
  }else{
    mod.groups.forEach(function(g,gi){iter(g,gi,null);});
  }
  if(filingCount>0)return{total:filingMax-filingDeduct,max:filingMax,isFiling:true};
  return{total:pmTotal,max:pmMax,isFiling:false};
}

var inspScrollBound=false;
function bindInspectionScroll(){
  if(inspScrollBound)return;
  var main=document.getElementById('inspMain');
  if(!main)return;
  main.addEventListener('scroll',function(){
    var sections=main.querySelectorAll('.insp-module');
    var scrollTop=main.scrollTop;
    var current=null;
    for(var i=sections.length-1;i>=0;i--){
      if(sections[i].offsetTop-60<=scrollTop){current=sections[i];break;}
    }
    if(!current){
      if(sections.length>0){current=sections[0];}
    }
    if(current){
      var modId=current.getAttribute('data-mod');
      highlightSidebar(modId);
    }
  });
  inspScrollBound=true;
}

          });

/* ===== RENDER DETAIL ===== */
function renderDetail(modId,subId){
  var mod=getModule(modId);if(!mod)return;
  var target=subId?getSubModule(modId,subId):mod;
  if(!target)return;
  var body=document.getElementById('detailBody');
  var html='';
  // header
  var total=countGroupItems(target.groups);
  var done=0;
  target.groups.forEach(function(g,gi){
    g.items.forEach(function(it,ii){
      if(checkResults[myResultKey(itemKey(modId,subId,gi,ii))])done++;
    });
  });
  html+='<div class="detail-header"><span class="dh-icon">'+(target.icon||mod.icon)+'</span><span class="dh-name">'+target.name+'</span><span class="dh-count">'+done+'/'+total+'</span></div>';

    html+='<div class="loc-image"><img src="assets/'+target.img+'" alt="'+target.name+'效果图" onerror="this.parentElement.style.display=\'none\'"><div class="loc-img-label">'+target.name+' 效果图参考</div></div>';
  }
  if(target.imgs){
    target.imgs.forEach(function(im){
      html+='<div class="loc-image"><img src="assets/'+im+'" alt="'+target.name+'效果图" onerror="this.parentElement.style.display=\'none\'"><div class="loc-img-label">'+target.name+' 效果图参考</div></div>';

}

/* ===== ITEM INTERACTIONS ===== */
function setResult(key,result){
  var rk=myResultKey(key);
  checkResults[rk]=result;
  var passBtn=document.getElementById('pass_'+key);
  var failBtn=document.getElementById('fail_'+key);
  var partialBtn=document.getElementById('partialbtn_'+key);
  var photo=document.getElementById('photo_'+key);
  var partialBox=document.getElementById('partialbox_'+key);
  if(passBtn)passBtn.classList.toggle('active',result==='pass');
  if(failBtn)failBtn.classList.toggle('active',result==='fail');
  if(partialBtn)partialBtn.classList.toggle('active',result==='partial');
  if(photo)photo.classList.toggle('show',result==='fail');
  if(partialBox)partialBox.classList.toggle('show',result==='partial');
}

function restoreItemState(key){
  var rk=myResultKey(key);
  var r=checkResults[rk];
  if(currentRole==='pm'&&!r&&!isDeductionItem(key)){r='pass';checkResults[rk]='pass';}
  var passBtn=document.getElementById('pass_'+key);
  var failBtn=document.getElementById('fail_'+key);
  var partialBtn=document.getElementById('partialbtn_'+key);
  var photo=document.getElementById('photo_'+key);
  var partialBox=document.getElementById('partialbox_'+key);
  if(passBtn)passBtn.classList.toggle('active',r==='pass');
  if(failBtn)failBtn.classList.toggle('active',r==='fail');
  if(partialBtn)partialBtn.classList.toggle('active',r==='partial');
  if(photo)photo.classList.toggle('show',r==='fail');
  if(partialBox)partialBox.classList.toggle('show',r==='partial');
  if(checkPhotos[rk]&&checkPhotos[rk].length){
    var pv=document.getElementById('preview_'+key);
    if(pv){
      var ph='';
      checkPhotos[rk].forEach(function(d){ph+='<img src="'+d+'">';});
      pv.innerHTML=ph;
    }
  }
}

function onValueInput(key,val){
  var vk=myResultKey(key);
  checkValues[vk]=val;
}

function onPartialInput(key,pMin,pMax,val){
  var rk=myResultKey(key);
  var num=parseFloat(val);
  if(isNaN(num))num=pMin;
  if(num<pMin)num=pMin;
  if(num>pMax)num=pMax;
  checkPartialScores[rk]=num;
  var cur=document.getElementById('pscur_'+key);
  if(cur)cur.textContent=num;
  var inp=document.getElementById('psinput_'+key);
  if(inp&&parseFloat(inp.value)!==num)inp.value=num;
}

function onPhotoUpload(key,input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var pk=myResultKey(key);
    if(!checkPhotos[pk])checkPhotos[pk]=[];
    checkPhotos[pk].push(e.target.result);
    var pv=document.getElementById('preview_'+key);
    if(pv){
      var img=document.createElement('img');
      img.src=e.target.result;
      pv.appendChild(img);
    }
    showToast('照片已上传');
  };
  reader.readAsDataURL(file);
}

/* ===== ROOM SAMPLING ===== */
function generateRoomNumbers(){
  var sampleCount=Math.ceil(TOTAL_ROOMS*SAMPLE_RATIO);
  var pool=[];
  for(var i=1;i<=TOTAL_ROOMS;i++)pool.push(i);
  // Fisher-Yates shuffle
  for(var j=pool.length-1;j>0;j--){
    var k=Math.floor(Math.random()*(j+1));
    var tmp=pool[j];pool[j]=pool[k];pool[k]=tmp;
  }
  roomNumbers=pool.slice(0,sampleCount).sort(function(a,b){return a-b;});
}
function roomItemKey(roomIdx,ci){return 'room_'+roomIdx+'_'+ci;}
function roomDoneCount(idx){
  var c=0;
  for(var i=0;i<roomCheckItems.length;i++){
    if(roomCheckResults[roomItemKey(idx,i)])c++;
  }
  return c;
}
function enterRoomSampling(){
  if(roomNumbers.length===0)generateRoomNumbers();
  document.getElementById('headerTitle').textContent='客房抽检';
  document.getElementById('backBtn').style.visibility='visible';
  renderRoomsView();
  showPage('page-rooms');
}
function renderRoomsView(){
  var sampleCount=Math.ceil(TOTAL_ROOMS*SAMPLE_RATIO);
  var doneTotal=0;
  roomNumbers.forEach(function(rn,idx){if(roomDoneCount(idx)===roomCheckItems.length)doneTotal++;});
  var html='';
  html+='<div class="room-info">';
  html+='<div class="ri-row"><span class="ri-label">总客房数</span><span class="ri-value">'+TOTAL_ROOMS+'间</span></div>';
  html+='<div class="ri-row"><span class="ri-label">抽检比例</span><span class="ri-value">'+(SAMPLE_RATIO*100)+'%</span></div>';
  html+='<div class="ri-row"><span class="ri-label">抽检数量</span><span class="ri-value">'+sampleCount+'间</span></div>';
  html+='<div class="ri-row"><span class="ri-label">已完成</span><span class="ri-value" style="color:var(--green)">'+doneTotal+'/'+sampleCount+'间</span></div>';
  html+='<div class="ri-tip">系统自动随机抽取，涵盖各房型（标准间/商务大床房/暗房/特殊备案房型）</div>';
  html+='<button class="ri-regen" onclick="regenerateRooms()">重新生成抽检房号</button>';
  html+='</div>';
  html+='<div class="room-grid">';
  roomNumbers.forEach(function(rn,idx){
    var done=roomDoneCount(idx);
    var isDone=done===roomCheckItems.length;
    html+='<div class="room-card'+(isDone?' done':'')+'" onclick="enterRoom('+idx+')">';
    html+='<div class="rc-check">✓</div>';
    html+='<div class="rc-num">'+rn+'</div>';
    html+='<div class="rc-status">'+(isDone?'已完成':done>0?done+'/'+roomCheckItems.length:'未检查')+'</div>';
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('roomsBody').innerHTML=html;
}
function regenerateRooms(){
  roomCheckResults={};roomCheckPhotos={};roomCheckPartialScores={};
  generateRoomNumbers();
  renderRoomsView();
  showToast('已重新生成'+roomNumbers.length+'个抽检房号');
}
function enterRoom(idx){
  currentRoomIdx=idx;
  renderRoomDetail(idx);
  document.getElementById('headerTitle').textContent=roomNumbers[idx]+'号房 抽检';
  document.getElementById('backBtn').style.visibility='visible';
  showPage('page-room');
}
function renderRoomDetail(idx){
  var body=document.getElementById('roomDetailBody');
  var done=roomDoneCount(idx);
  var html='';
  html+='<div class="detail-header"><span class="dh-icon">🛏️</span><span class="dh-name">'+roomNumbers[idx]+'号房</span><span class="dh-count">'+done+'/'+roomCheckItems.length+'</span></div>';
  html+='<div class="loc-image"><img src="assets/guestroom_feishu.jpg" alt="客房效果图" onerror="this.parentElement.style.display=\'none\'"><div class="loc-img-label">客房效果图参考</div></div>';
  html+='<div class="section-header"><span class="sh-tag subjective">客房检查</span><span class="sh-line"></span><span class="sh-count">'+roomCheckItems.length+'项</span></div>';
  roomCheckItems.forEach(function(it,ci){
    var key=roomItemKey(idx,ci);
    var r=roomCheckResults[key]||'pass';
    var isPartial=it.scoreType==='partial';
    html+='<div class="check-item" id="roomitem_'+key+'">';
    html+='<div class="ci-name">'+it.name+'<span class="ci-score">'+(it.score>0?'满分:'+it.score+'分':'不计分')+'</span></div>';
    html+='<div class="ci-standard">'+it.standard+'</div>';
    html+='<div class="ci-actions'+(isPartial?' ci-actions-partial':'')+'">';
    html+='<button class="ci-btn pass'+(r==='pass'?' active':'')+'" onclick="setRoomResult(\''+key+'\',\'pass\')">✓ 符合</button>';
    if(isPartial){
      html+='<button class="ci-btn partial'+(r==='partial'?' active':'')+'" onclick="setRoomResult(\''+key+'\',\'partial\')">◐ 比较符合</button>';
    }
    html+='<button class="ci-btn fail'+(r==='fail'?' active':'')+'" onclick="setRoomResult(\''+key+'\',\'fail\')">✗ 不符合</button>';
    html+='</div>';
    if(isPartial){
      var pMin=it.partialMin||0;
      var pMax=it.partialMax||0;
      var defVal=roomCheckPartialScores[key];
      if(defVal===undefined||defVal===null||isNaN(defVal))defVal=pMax;
      html+='<div class="partial-score'+(r==='partial'?' show':'')+'" id="roompartialbox_'+key+'">';
      html+='<div class="ps-label">分值范围：'+pMin+' ~ '+pMax+' 分</div>';
      html+='<div class="ps-row">';
      html+='<input type="number" class="ps-input" id="roompsinput_'+key+'" min="'+pMin+'" max="'+pMax+'" step="0.5" value="'+defVal+'" oninput="onRoomPartialInput(\''+key+'\','+pMin+','+pMax+',this.value)">';
      html+='<div class="ps-cur">当前得分：<span id="roompscur_'+key+'">'+defVal+'</span> 分</div>';
      html+='</div></div>';
    }
    html+='<div class="photo-upload'+(r==='fail'?' show':'')+'" id="roomphoto_'+key+'">';
    html+='<div class="pu-label">不符合照片（必传）</div>';
    html+='<div class="pu-area" onclick="document.getElementById(\'roomfile_'+key+'\').click()">';
    html+='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>';
    html+='<div class="pu-text">点击上传照片</div></div>';
    html+='<input type="file" accept="image/*" capture="environment" id="roomfile_'+key+'" style="display:none" onchange="onRoomPhotoUpload(\''+key+'\',this)">';
    html+='<div class="pu-preview" id="roompreview_'+key+'">';
    if(roomCheckPhotos[key]&&roomCheckPhotos[key].length){
      roomCheckPhotos[key].forEach(function(d){html+='<img src="'+d+'">';});
    }
    html+='</div></div></div>';
  });
  // Room score summary
  var roomTotal=0,roomMax=0;
  roomCheckItems.forEach(function(it,ci){
    var key=roomItemKey(idx,ci);
    roomMax+=it.score||0;
    if(roomCheckResults[key]==='pass')roomTotal+=it.score||0;
    else if(roomCheckResults[key]==='partial')roomTotal+=(roomCheckPartialScores[key]||0);
  });
  html+='<div class="score-detail">';
  html+='<div class="sd-title">📊 本房得分情况</div>';
  html+='<div class="sd-row"><span class="sd-label">质检经理</span><span class="sd-val qc">'+roomTotal+'/'+roomMax+'分</span></div>';
  html+='</div>';
  body.innerHTML=html;
}
function setRoomResult(key,result){
  roomCheckResults[key]=result;
  var passBtn=document.querySelector('#roomitem_'+key+' .ci-btn.pass');
  var failBtn=document.querySelector('#roomitem_'+key+' .ci-btn.fail');
  var partialBtn=document.querySelector('#roomitem_'+key+' .ci-btn.partial');
  var photo=document.getElementById('roomphoto_'+key);
  var partialBox=document.getElementById('roompartialbox_'+key);
  if(passBtn)passBtn.classList.toggle('active',result==='pass');
  if(failBtn)failBtn.classList.toggle('active',result==='fail');
  if(partialBtn)partialBtn.classList.toggle('active',result==='partial');
  if(photo)photo.classList.toggle('show',result==='fail');
  if(partialBox)partialBox.classList.toggle('show',result==='partial');
}
function onRoomPhotoUpload(key,input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    if(!roomCheckPhotos[key])roomCheckPhotos[key]=[];
    roomCheckPhotos[key].push(e.target.result);
    var pv=document.getElementById('roompreview_'+key);
    if(pv){var img=document.createElement('img');img.src=e.target.result;pv.appendChild(img);}
    showToast('照片已上传');
  };
  reader.readAsDataURL(file);
}

function onRoomPartialInput(key,pMin,pMax,val){
  var num=parseFloat(val);
  if(isNaN(num))num=pMin;
  if(num<pMin)num=pMin;
  if(num>pMax)num=pMax;
  roomCheckPartialScores[key]=num;
  var cur=document.getElementById('roompscur_'+key);
  if(cur)cur.textContent=num;
  var inp=document.getElementById('roompsinput_'+key);
  if(inp&&parseFloat(inp.value)!==num)inp.value=num;
}

/* ===== UTILS ===== */
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}
function saveProgress(){
  showToast('进度已保存');
  renderModuleList();
}

/* ===== INIT ===== */
applyRole();
renderModuleList();
document.querySelector('.header').style.display='none';
</script>
</body>
</html>
